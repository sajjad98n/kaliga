<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لیگ فوتسال روستای چاشم</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- فونت فارسی Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #151a2c;
      --card: #1d2236;
      --accent: #18a34a;
      --accent-soft: rgba(24, 163, 74, 0.2);
      --text: #f9fafb;
      --text-soft: #a1a5b5;
      --danger: #ef4444;
      --border: #262c46;
      --radius-lg: 18px;
      --radius-full: 999px;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      font-family: "Vazirmatn", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, var(--bg-soft), var(--bg) 55%);
      color: var(--text);
      overflow-x: hidden; /* جلوگیری از اسکرول افقی در موبایل */
    }

    /* لایه موشن‌گرافی ورود */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #020617, #000000);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .intro-frame {
      padding: 10px;
      border-radius: 26px;
      background: radial-gradient(circle at top, #1f2937, #020617 70%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.6);
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-video {
      max-width: 100%;
      max-height: 100%;
      display: block;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(15, 23, 42, 0.9);
    }

    .intro-skip {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.9);
      color: #f9fafb;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
      direction: ltr;
      border: 1px solid rgba(148, 163, 184, 0.7);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .app {
      max-width: 1100px;
      margin: 24px auto 40px;
      padding: 0 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 65px;
      height: 65px;
      border-radius: 20px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      padding: 0;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-text-title {
      font-size: 22px;
      font-weight: 700;
    }

    .brand-text-sub {
      font-size: 13px;
      color: var(--text-soft);
    }

    .header-right {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      font-size: 12px;
      color: var(--text-soft);
    }

    .live-pill {
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 11px;
    }

    .audio-toggle,
    .mode-toggle {
      margin-top: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .audio-toggle.active,
    .mode-toggle.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(34, 197, 94, 0.8);
    }

    nav {
      display: flex;
      gap: 8px;
      padding: 4px;
      background: rgba(9, 12, 24, 0.85);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(56, 63, 99, 0.8);
      box-shadow: var(--shadow-soft);
      margin-bottom: 18px;
      backdrop-filter: blur(14px);
    }

    nav button {
      flex: 1;
      border-radius: 999px;
      border: none;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      transition: 0.18s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    nav button .nav-icon {
      font-size: 16px;
    }

    nav button .nav-label {
      white-space: nowrap;
    }

    nav button.active {
      background: linear-gradient(135deg, var(--accent), #22c55e);
      color: #ecfdf3;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.55);
    }

    nav button.active .nav-icon {
      filter: drop-shadow(0 0 6px rgba(22, 163, 74, 0.8));
    }

    nav button:hover:not(.active) {
      background: rgba(37, 44, 79, 0.75);
      color: var(--text);
    }

    main {
      margin-top: 14px;
    }

    .section-title {
      font-size: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span.dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
    }

    .card {
      background: radial-gradient(circle at top left, var(--card), var(--bg-soft) 55%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .match-row {
      display: grid;
      grid-template-columns: 1.2fr auto 1.2fr;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .team-side {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-home {
      justify-content: flex-start;
    }

    .team-away {
      justify-content: flex-end;
    }

    .match-meta {
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }

    .team-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-name {
      font-weight: 500;
    }

    .team-logo {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #f9fafb;
      border: 1px solid rgba(15, 23, 42, 0.6);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.5);
    }

    .match-center {
      text-align: center;
    }

    .match-score {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .match-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-top: 2px;
    }

    .status-finished {
      background: rgba(37, 99, 235, 0.12);
      color: #60a5fa;
    }

    .status-live {
      background: rgba(248, 113, 113, 0.1);
      color: #f87171;
    }

    .status-upcoming {
      background: rgba(148, 163, 184, 0.12);
      color: #e5e7eb;
    }

    /* تب‌های هفته‌ها */
    .week-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .week-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
    }

    .week-btn.active {
      background: var(--accent);
      color: #ecfdf3;
      border-color: transparent;
    }

    /* پیش‌بینی‌ها */
    .prediction-summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-soft);
    }

    .prediction-bars {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .prediction-bar {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      height: 16px;
    }

    .prediction-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      border-radius: 999px;
    }

    .prediction-fill-home {
      background: rgba(34, 197, 94, 0.5);
    }

    .prediction-fill-draw {
      background: rgba(148, 163, 184, 0.6);
    }

    .prediction-fill-away {
      background: rgba(59, 130, 246, 0.5);
    }

    .prediction-label {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 10px;
      line-height: 16px;
    }

    /* اکشن‌ها و کامنت‌ها */
    .match-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .action-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-soft);
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(30, 64, 175, 0.7);
      color: #e5e7eb;
    }

    .comments-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.4);
    }

    .comments-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 6px;
    }

    .comment-item {
      margin-bottom: 6px;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.85);
    }

    .comment-header {
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: 2px;
    }

    .comment-body {
      font-size: 12px;
    }

    .comment-empty {
      font-size: 11px;
      color: var(--text-soft);
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .comment-username {
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
    }

    .comment-username input {
      flex: 1;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 11px;
    }

    .comment-form textarea {
      resize: vertical;
      min-height: 40px;
      padding: 4px 6px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 12px;
    }

    .comment-form button {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ecfdf3;
      font-size: 11px;
      cursor: pointer;
    }

    .table-wrapper {
      background: radial-gradient(circle at top left, var(--card), var(--bg-soft) 58%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 8px 0 4px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      background: rgba(15, 23, 42, 0.95);
      color: var(--text);
    }

    th, td {
      padding: 7px 10px;
      text-align: center;
      border-bottom: 1px solid rgba(31, 41, 55, 0.9);
    }

    th:first-child, td:first-child {
      text-align: right;
    }

    th {
      font-weight: 600;
      color: var(--text-soft);
    }

    tbody tr:nth-child(even) {
      background: rgba(15, 23, 42, 0.7);
    }

    tbody tr:nth-child(odd) {
      background: rgba(15, 23, 42, 0.4);
    }

    .pos-pill {
      min-width: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 0;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .pos-top {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
    }

    .pos-mid {
      background: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
    }

    .pos-bottom {
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-name-sm {
      font-size: 12px;
    }

    /* گرید تیم‌ها: ۴ ردیف ۳تایی */
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .team-card {
      background: radial-gradient(circle at top, var(--card), var(--bg-soft) 58%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .team-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      color: var(--text-soft);
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.5);
      transition: 0.2s ease;
    }

    .badge:hover {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .tip-box {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-soft);
      border-radius: 14px;
      border: 1px dashed rgba(148, 163, 184, 0.6);
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.7);
    }

    .tip-box code {
      background: rgba(15, 23, 42, 0.9);
      padding: 2px 4px;
      border-radius: 6px;
      direction: ltr;
      display: inline-block;
      font-size: 10px;
    }

    .footer-credit {
      margin-top: 10px;
      font-size: 10px;
      color: rgba(148, 163, 184, 0.8);
      text-align: left;
      direction: ltr;
      line-height: 1.6;
    }

    .footer-credit a {
      color: rgba(148, 163, 184, 0.95);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-credit a:hover {
      text-decoration: underline;
    }

    /* پنجره نمایش عکس تیم‌ها */
    .team-image-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
    }

    .team-image-dialog {
      background: #000;
      border-radius: 22px;
      padding: 10px;
      max-width: min(340px, 90vw);
      max-height: 80vh;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .team-image-dialog img {
      max-width: 100%;
      max-height: 100%;
      display: block;
      border-radius: 16px;
    }

    /* دکمه منوی کناری */
    .menu-toggle-btn {
      position: fixed;
      top: 18px;
      left: 16px;
      z-index: 9000;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.95);
      color: var(--text-soft);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
    }

    .side-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      z-index: 8990;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      max-width: 80vw;
      height: 100%;
      background: radial-gradient(circle at top left, var(--card), var(--bg-soft) 65%);
      box-shadow: 8px 0 30px rgba(0, 0, 0, 0.7);
      transform: translateX(-100%);
      transition: transform 0.2s ease-out;
      z-index: 9001;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 12px;
    }

    .side-menu.open {
      transform: translateX(0);
    }

    .side-menu-header {
      font-weight: 600;
      font-size: 14px;
    }

    .side-menu-close {
      align-self: flex-end;
      border: none;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      font-size: 18px;
    }

    .side-menu-nav {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .side-menu-item {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-soft);
    }

    .side-menu-item:hover {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* پنجره جزئیات بازی */
    .match-details-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9500;
    }

    .match-details-dialog {
      background: radial-gradient(circle at top, var(--card), var(--bg-soft) 60%);
      border-radius: 20px;
      padding: 14px 16px;
      max-width: 420px;
      width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      font-size: 12px;
    }

    .match-details-close {
      border: none;
      background: transparent;
      color: var(--text-soft);
      font-size: 18px;
      cursor: pointer;
      float: left;
    }

    .match-details-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .match-details-section-title {
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .match-details-list {
      margin: 0;
      padding-left: 18px;
    }

    /* رسانه و اطلاعیه‌ها */
    .media-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }

    .media-item-title {
      font-weight: 500;
    }

    .media-tag {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      margin-left: 4px;
    }

    /* آمار لیگ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .stats-table th,
    .stats-table td {
      padding: 4px 6px;
      border-bottom: 1px solid rgba(31, 41, 55, 0.7);
      text-align: center;
    }

    .stats-table th {
      color: var(--text-soft);
    }

    /* جلوگیری از شکستن بد فرم متن‌ها در دیالوگ و رسانه */
    .match-details-dialog,
    .media-list,
    .media-list div {
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    @media (max-width: 900px) {
      .teams-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .teams-grid {
        grid-template-columns: repeat(1, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-right {
        align-items: flex-start;
      }
      .match-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .team-away {
        justify-content: flex-start;
      }
      .match-center {
        justify-self: flex-start;
        text-align: right;
      }
      .match-meta {
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
      }
    }

    /* بهینه‌سازی فقط برای موبایل عمودی */
    @media (max-width: 768px) and (orientation: portrait) {
      .app {

    async function savePredictionToDB(matchId, homeScore, awayScore) {
      try {
        const username = getSavedUsername() || null;

        const { error } = await db
          .from("predictions")
          .insert({
            match_id: matchId,
            username,
            home_score: homeScore,
            away_score: awayScore
          });

        if (error) {
          console.error("خطا در ذخیره پیش‌بینی:", error);
          alert("خطا در ذخیره پیش‌بینی رخ داد.");
        }
      } catch (e) {
        console.error(e);
        alert("مشکل در ارتباط با سرور پیش‌بینی.");
      }
    }

    async function getPredictionStats(matchId) {
      try {
        const { data, error } = await db
          .from("predictions")
          .select("home_score, away_score")
          .eq("match_id", matchId);

        if (error) {
          console.error("خطا در خواندن پیش‌بینی‌ها:", error);
          return null;
        }

        if (!data || data.length === 0) return null;

        let home = 0, draw = 0, away = 0;
        data.forEach(r => {
          if (r.home_score > r.away_score) home++;
          else if (r.home_score < r.away_score) away++;
          else draw++;
        });

        const total = home + draw + away;
        if (!total) return null;

        return {
          total,
          homePercent: Math.round(home * 100 / total),
          drawPercent: Math.round(draw * 100 / total),
          awayPercent: Math.round(away * 100 / total)
        };
      } catch (e) {
        console.error(e);
        return null;
      }
    }

          .order("created_at", { ascending: true });

          return [];
        }

        return data || [];
      } catch (e) {

      }

    async function loadAndRenderComments(matchId) {
      const container = document.getElementById(`comments-${matchId}`);

      const comments = await fetchComments(matchId);
      const username = getSavedUsername();

      let html = `<div class="comments-list">`;

      if (!comments.length) {
        html += `<div class="comment-empty">هنوز نظری برای این بازی ثبت نشده است.</div>`;
      } else {
        comments.forEach(c => {
          const name = c.username || "کاربر مهمان";
          const timeStr = new Date(c.created_at).toLocaleString("fa-IR");
          html += `
            <div class="comment-item">
              <div class="comment-header">${escapeHtml(name)} • <span style="opacity:0.7;">${timeStr}</span></div>
              <div class="comment-body">${escapeHtml(c.body)}</div>

      `;

    // -----------------------------
    // ۷) جدول لیگ
    // -----------------------------
    function calculateTable() {
      const stats = new Map();
      teams.forEach(team => {
        stats.set(team.id, {
          teamId: team.id,
          played: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          goalsFor: 0,
          goalsAgainst: 0,
          points: 0
        });
      });

      matches.filter(m => m.status === "finished").forEach(match => {
        const homeStat = stats.get(match.homeTeamId);
        const awayStat = stats.get(match.awayTeamId);

        homeStat.played++;
        awayStat.played++;

        homeStat.goalsFor += match.homeScore;
        homeStat.goalsAgainst += match.awayScore;

        awayStat.goalsFor += match.awayScore;
        awayStat.goalsAgainst += match.homeScore;

        if (match.homeScore > match.awayScore) {
          homeStat.wins++;
          awayStat.losses++;
          homeStat.points += 3;
        } else if (match.homeScore < match.awayScore) {
          awayStat.wins++;
          homeStat.losses++;
          awayStat.points += 3;
        } else {
          homeStat.draws++;
          awayStat.draws++;
          homeStat.points++;
          awayStat.points++;
        }
      });

      const tableArray = Array.from(stats.values());
      tableArray.sort((a, b) => {
        const gdA = a.goalsFor - a.goalsAgainst;
        const gdB = b.goalsFor - b.goalsAgainst;
        if (b.points !== a.points) return b.points - a.points;
        if (gdB !== gdA) return gdB - gdA;
        if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
        const teamA = getTeamById(a.teamId).name;
        const teamB = getTeamById(b.teamId).name;
        return teamA.localeCompare(teamB, "fa");
      });

      return tableArray;
    }

    function getPosClass(pos) {
      if (pos <= 4) return "pos-top";
      if (pos >= 10) return "pos-bottom";
      return "pos-mid";
    }

      const match = matches.find(m => m.id === matchId);
      if (!match) return;

      const home = getTeamById(match.homeTeamId);
      const away = getTeamById(match.awayTeamId);

      let hs = prompt(`گل‌های ${home.name} را برای پیش‌بینی وارد کن:`, "0");
      if (hs === null) return;
      let as = prompt(`گل‌های ${away.name} را برای پیش‌بینی وارد کن:`, "0");
      if (as === null) return;

      hs = parseInt(hs, 10);
      as = parseInt(as, 10);

      if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0) {
        alert("لطفاً فقط عدد صحیح مثبت وارد کن.");
        return;
      }

      await savePredictionToDB(matchId, hs, as);
      alert("پیش‌بینی شما ذخیره شد.");

    function getCurrentThemeList() {
      return currentMode === "dark" ? darkThemes : lightThemes;

    function applyTheme(theme) {
      const root = document.documentElement;
      root.style.setProperty("--bg", theme.bg);
      root.style.setProperty("--bg-soft", theme.bgSoft);
      root.style.setProperty("--card", theme.card);
      root.style.setProperty("--accent", theme.accent);
      root.style.setProperty("--accent-soft", theme.accentSoft);
      root.style.setProperty("--text", theme.text || "#f9fafb");
      root.style.setProperty("--text-soft", theme.textSoft || "#a1a5b5");
      root.style.setProperty("--border", theme.border);

      document.body.style.background =
        `radial-gradient(circle at top, ${theme.bgSoft}, ${theme.bg} 55%)`;
    }

    function initTheme() {
      const list = getCurrentThemeList();
      if (!list.length) return;
      applyTheme(list[currentThemeIndex]);
    }

    function rotateTheme() {
      const list = getCurrentThemeList();
      if (!list.length) return;
      currentThemeIndex = (currentThemeIndex + 1) % list.length;
      applyTheme(list[currentThemeIndex]);
    }

    function setMode(mode) {
      currentMode = mode;
      currentThemeIndex = 0;
      initTheme();
      const modeToggle = document.getElementById("mode-toggle");
      if (modeToggle) {
        if (currentMode === "dark") {
          modeToggle.textContent = "🌙 حالت تیره";
        } else {
          modeToggle.textContent = "☀️ حالت روشن";
        }
      }
    }

    // -----------------------------
    // ۱۳) مدیریت تب‌ها
    // -----------------------------
    function setActivePage(page) {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
      });

      if (page === "fixtures") renderFixturesPage();
      else if (page === "results") renderResultsPage();
      else if (page === "table") renderTablePage();
      else if (page === "teams") renderTeamsPage();
      else if (page === "media") renderMediaPage();
      else if (page === "stats") renderStatsPage();
    }

    // -----------------------------
    // ۱۴) نمایش/مخفی کردن عکس تیم
    // -----------------------------
    function showTeamImage(teamId) {
      const overlay = document.getElementById("team-image-overlay");
      const img = document.getElementById("team-image-img");
      const dialog = document.querySelector(".team-image-dialog");
      if (!overlay || !img || !dialog) return;

      overlay.style.display = "flex";
      dialog.style.background = "#000";
      img.style.display = "block";

      let triedPng = false;
      img.onerror = () => {
        if (!triedPng) {
          triedPng = true;
          img.src = `pic${teamId}.png`;
        } else {
          img.style.display = "none";
          dialog.style.background = "#000";
        }
      };

      img.src = `pic${teamId}.jpg`;
    }

    function hideTeamImage() {
      const overlay = document.getElementById("team-image-overlay");
      if (overlay) overlay.style.display = "none";
    }

    // -----------------------------
    // ۱۵) جزئیات بازی
    // -----------------------------
    function showMatchDetails(matchId) {
      const overlay = document.getElementById("match-details-overlay");
      const content = document.getElementById("match-details-content");
      if (!overlay || !content) return;

      const match = matches.find(m => m.id === matchId);
      if (!match) return;

      const home = getTeamById(match.homeTeamId);
      const away = getTeamById(match.awayTeamId);

      const d = matchDetails[matchId] || {
        homeScorers: [`گلزن‌های تیم ${home.name}: ...`],
        awayScorers: [`گلزن‌های تیم ${away.name}: ...`],
        yellowCards: ["کارت زرد: ..."],
        redCards: ["کارت قرمز: ..."]
      };

      let html = `
        <div class="match-details-title">
          جزئیات بازی: ${escapeHtml(home.name)} ${match.homeScore} - ${match.awayScore} ${escapeHtml(away.name)}
        </div>
        <div style="font-size:11px;color:var(--text-soft);margin-bottom:6px;">
          هفته ${match.week} • ${escapeHtml(match.stadium)} • ${formatDate(match.date)} • ${match.time}
        </div>

        <div class="match-details-section-title">گلزن‌های ${escapeHtml(home.name)}</div>
        <ul class="match-details-list">
      `;

      (d.homeScorers || []).forEach(item => {
        html += `<li>${escapeHtml(item)}</li>`;
      });

      html += `
        </ul>

        <div class="match-details-section-title">گلزن‌های ${escapeHtml(away.name)}</div>
        <ul class="match-details-list">
      `;

      (d.awayScorers || []).forEach(item => {
        html += `<li>${escapeHtml(item)}</li>`;
      });

      html += `
        </ul>

        <div class="match-details-section-title">کارت‌های زرد</div>
        <ul class="match-details-list">
      `;

      (d.yellowCards || []).forEach(item => {
        html += `<li>${escapeHtml(item)}</li>`;
      });

      html += `
        </ul>

        <div class="match-details-section-title">کارت‌های قرمز</div>
        <ul class="match-details-list">
      `;

      (d.redCards || []).forEach(item => {
        html += `<li>${escapeHtml(item)}</li>`;
      });

      html += `</ul>`;

      content.innerHTML = html;
      overlay.style.display = "flex";
    }

    function closeMatchDetails() {
      const overlay = document.getElementById("match-details-overlay");
      if (overlay) overlay.style.display = "none";
    }

    // -----------------------------
    // ۱۶) منوی کناری
    // -----------------------------
    function openSideMenu() {
      const menu = document.getElementById("side-menu");
      const backdrop = document.getElementById("side-menu-backdrop");
      if (menu && backdrop) {
        menu.classList.add("open");
        backdrop.style.display = "block";
      }
    }

    function closeSideMenu() {
      const menu = document.getElementById("side-menu");
      const backdrop = document.getElementById("side-menu-backdrop");
      if (menu && backdrop) {
        menu.classList.remove("open");
        backdrop.style.display = "none";
      }
    }

    function navigateMenu(where) {
      if (where === "home") setActivePage("fixtures");
      else if (where === "media") setActivePage("media");
      else if (where === "stats") setActivePage("stats");
      closeSideMenu();
    }

    // -----------------------------
    // ۱۷) موشن‌گرافی
    // -----------------------------
    function hideIntro() {
      const overlay = document.getElementById("intro-overlay");
      const video = document.getElementById("intro-video");
      if (video) {
        video.pause();
      }
      if (overlay) {
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
        }, 300);
      }
    }

    // -----------------------------
    // ۱۸) ثبت بازدید
    // -----------------------------
    async function incrementPageView() {
      try {
        await db.from("page_views").insert({});
      } catch (e) {
        console.error("خطا در ثبت بازدید:", e);
      }
    }

    // -----------------------------
    // ۱۹) شروع کار
    // -----------------------------
    document.addEventListener("DOMContentLoaded", () => {
      setMode("dark");

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          setActivePage(btn.dataset.page);
          rotateTheme();
        });
      });
      setActivePage("fixtures");

      const modeToggle = document.getElementById("mode-toggle");
      if (modeToggle) {
        modeToggle.addEventListener("click", () => {
          setMode(currentMode === "dark" ? "light" : "dark");
        });
      }

      const audio = document.getElementById("bg-audio");
      const audioToggle = document.getElementById("audio-toggle");

      if (audio && audioToggle) {
        audio.volume = 0.4;

        audio.play().catch(() => {});

        function updateAudioButton() {
          if (audio.paused) {
            audioToggle.textContent = "🔈 موسیقی خاموش";
            audioToggle.classList.remove("active");
          } else {
            audioToggle.textContent = "🔊 موسیقی روشن";
            audioToggle.classList.add("active");
          }
        }

        updateAudioButton();

        audioToggle.addEventListener("click", () => {
          if (audio.paused) {
            audio.play().catch(() => {});
          } else {
            audio.pause();
          }
          updateAudioButton();
        });
      }

      const introVideo = document.getElementById("intro-video");
      if (introVideo) {
        introVideo.play().catch(() => {});
      }
      setTimeout(() => {
        hideIntro();
      }, 3000);

      const menuToggle = document.getElementById("menu-toggle");
      if (menuToggle) {
        menuToggle.addEventListener("click", openSideMenu);
      }

      incrementPageView();
    });
  </script>
</body>
</html>
