  <meta name="keywords" 
      content="کالیگا, لیگ فوتسال چاشم, لیگ چاشم, فوتسال کالیگا, لیگ فوتسال روستای چاشم، چاشم ، سمنان، شهمیرزاد، مهدیشهر، لیگ، فوتسال، جوانان، هیئت، هیئت جوانان" />

  <!-- فونت فارسی Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a1126;
      --bg-soft: #191c28;
      --card: #2c3040;
      --accent: #18a34a;
      --accent-soft: rgba(24, 163, 74, 0.2);
      --text: #f9fafb;
      --text-soft: #a1a5b5;
      --danger: #ef4444;
      --border: #262c46;
      --radius-lg: 18px;
      --radius-full: 999px;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      font-family: "Vazirmatn", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, var(--bg-soft), var(--bg) 55%);
      color: var(--text);
      overflow-x: hidden; /* جلوگیری از اسکرول افقی در موبایل */
    }

    /* لایه موشن‌گرافی ورود */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #020617, #000000);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .intro-frame {
      padding: 10px;
      border-radius: 26px;
      background: radial-gradient(circle at top, #1f2937, #020617 70%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.6);
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-video {
      max-width: 100%;
      max-height: 100%;
      display: block;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(15, 23, 42, 0.9);
    }

    .intro-skip {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.9);
      color: #f9fafb;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
      direction: ltr;
      border: 1px solid rgba(148, 163, 184, 0.7);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .app {
      max-width: 1100px;
      margin: 24px auto 40px;
      padding: 0 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 65px;
      height: 65px;
      border-radius: 20px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      padding: 0;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-text-title {
      font-size: 22px;
      font-weight: 700;
    }

    .brand-text-sub {
      font-size: 13px;
      color: var(--text-soft);
    }

    .header-right {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      font-size: 12px;
      color: var(--text-soft);
    }

    /* تاریخ و ساعت زنده */
    .current-datetime {
      font-size: 11px;
      color: var(--text-soft);
    }

    .live-pill {
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 11px;
    }

    .audio-toggle,
    .mode-toggle {
      margin-top: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .audio-toggle.active,
    .mode-toggle.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(34, 197, 94, 0.8);
    }

    nav {
      display: flex;
      gap: 8px;
      padding: 4px;
      background: rgba(9, 12, 24, 0.85);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(56, 63, 99, 0.8);
      box-shadow: var(--shadow-soft);
      margin-bottom: 18px;
      backdrop-filter: blur(14px);
    }

    nav button {
      flex: 1;
      border-radius: 999px;
      border: none;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      transition: 0.18s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    nav button .nav-icon {
      font-size: 16px;
    }

    nav button .nav-label {
      white-space: nowrap;
    }

    nav button.active {
      background: linear-gradient(135deg, var(--accent), #22c55e);
      color: #ecfdf3;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.55);
    }

    nav button.active .nav-icon {
      filter: drop-shadow(0 0 6px rgba(22, 163, 74, 0.8));
    }

    nav button:hover:not(.active) {
      background: rgba(37, 44, 79, 0.75);
      color: var(--text);
    }

    main {
      margin-top: 14px;
    }

    .section-title {
      font-size: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span.dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
    }

    .card {
      background: radial-gradient(circle at top left, var(--card), var(--bg-soft) 55%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .match-row {
      display: grid;
      grid-template-columns: 1.2fr auto 1.2fr;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .team-side {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-home {
      justify-content: flex-start;
    }

    .team-away {
      justify-content: flex-end;
    }

    .match-meta {
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }

    .team-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-name {
      font-weight: 500;
    }

    .team-logo {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #f9fafb;
      border: 1px solid rgba(15, 23, 42, 0.6);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.5);
      overflow: hidden;
    }

    .team-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .team-logo-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* وقتی لوگو واقعاً لود می‌شود */
    .team-logo-has-img {
      background: transparent !important;
    }

    .team-logo-clickable {
      cursor: zoom-in;
    }

    .match-center {
      text-align: center;
    }

    .match-score {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .match-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-top: 2px;
    }

    .status-finished {
      background: rgba(37, 99, 235, 0.12);
      color: #60a5fa;
    }

    .status-live {
      background: rgba(248, 113, 113, 0.1);
      color: #f87171;
    }

    .status-upcoming {
      background: rgba(148, 163, 184, 0.12);
      color: #e5e7eb;
    }

    /* تب‌های هفته‌ها */
    .week-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .week-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
    }

    .week-btn.active {
      background: var(--accent);
      color: #ecfdf3;
      border-color: transparent;
    }

    /* پیش‌بینی‌ها */
    .prediction-summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-soft);
    }

    .prediction-bars {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .prediction-bar {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      height: 16px;
    }

    .prediction-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      border-radius: 999px;
    }

    .prediction-fill-home {
      background: rgba(34, 197, 94, 0.5);
    }

    .prediction-fill-draw {
      background: rgba(148, 163, 184, 0.6);
    }

    .prediction-fill-away {
      background: rgba(59, 130, 246, 0.5);
    }

    .prediction-label {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 10px;
      line-height: 16px;
    }

    .prediction-donut-wrapper {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .prediction-donut {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.7);
      /* 🎬 انیمیشن لود شدن */
      animation: prediction-pop 0.6s ease-out;
    }

    .prediction-donut-inner {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: var(--bg-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      text-align: center;
      color: var(--pred-text);
      /* انیمیشن محو شدن نرم متن وسط */
      animation: prediction-inner-fade 0.6s ease-out 0.1s both;
    }

    .prediction-donut-label {
      opacity: 0.8;
    }

    .prediction-donut-value {
      font-weight: 700;
      font-size: 13px;
      margin-top: 2px;
      line-height: 1.4;
    }

    /* هایلایت قوی‌ترین پیش‌بینی */
    .prediction-donut.max-home::before,
    .prediction-donut.max-draw::before,
    .prediction-donut.max-away::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      pointer-events: none;
    }

    .prediction-donut.max-home::before {
      border: 2px solid var(--pred-home);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
    }

    .prediction-donut.max-draw::before {
      border: 2px solid var(--pred-draw);
      box-shadow: 0 0 12px rgba(148, 163, 184, 0.7);
    }

    .prediction-donut.max-away::before {
      border: 2px solid var(--pred-away);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.7);
    }

    .prediction-legend {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--pred-text);
    }

    .prediction-legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .prediction-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .prediction-legend-dot-home {
      background: var(--pred-home);
    }

    .prediction-legend-dot-draw {
      background: var(--pred-draw);
    }

    .prediction-legend-dot-away {
      background: var(--pred-away);
    }

    /* 🎥 keyframes انیمیشن‌ها */
    @keyframes prediction-pop {
      0% {
        transform: scale(0.4) rotate(-10deg);
        opacity: 0;
      }
      60% {
        transform: scale(1.05) rotate(2deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes prediction-inner-fade {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* اکشن‌ها و کامنت‌ها */
    .match-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .action-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-soft);
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(30, 64, 175, 0.7);
      color: #e5e7eb;
    }

    .comments-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.4);
    }

    .comments-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 6px;
    }

    .comment-item {
      margin-bottom: 6px;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.85);
    }

    .comment-header {
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: 2px;
    }

    .comment-body {
      font-size: 12px;
    }

    .comment-empty {
      font-size: 11px;
      color: var(--text-soft);
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .comment-username {
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
    }

    .comment-username input {
      flex: 1;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 11px;
    }

    .comment-form textarea {
      resize: vertical;
      min-height: 40px;
      padding: 4px 6px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 12px;
    }

    .comment-form button {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ecfdf3;
      font-size: 11px;
      cursor: pointer;
    }

    .table-wrapper {
      background: radial-gradient(circle at top left, var(--card), var(--bg-soft) 58%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 8px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      background: rgba(15, 23, 42, 0.95);
      color: var(--text);
    }

    th, td {
      padding: 7px 10px;
      text-align: center;
      border-bottom: 1px solid rgba(31, 41, 55, 0.9);
    }

    th:first-child, td:first-child {
      text-align: right;
    }

    th {
      font-weight: 600;
      color: var(--text-soft);
    }

    tbody tr:nth-child(even) {
      background: rgba(15, 23, 42, 0.7);
    }

    tbody tr:nth-child(odd) {
      background: rgba(15, 23, 42, 0.4);
    }

    .pos-pill {
      min-width: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 0;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .pos-top {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
    }

    .pos-mid {
      background: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
    }

    .pos-bottom {
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-name-sm {
      font-size: 12px;
    }

    /* گرید تیم‌ها: ۴ ردیف ۳تایی */
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .team-card {
      background: radial-gradient(circle at top, var(--card), var(--bg-soft) 58%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .team-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      color: var(--text-soft);
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.5);
      transition: 0.2s ease;
    }

    .badge:hover {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .tip-box {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-soft);
      border-radius: 14px;
      border: 1px dashed rgba(148, 163, 184, 0.6);
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.7);
    }

    .tip-box code {
      background: rgba(15, 23, 42, 0.9);
      padding: 2px 4px;
      border-radius: 6px;
      direction: ltr;
      display: inline-block;
      font-size: 10px;
    }

    .footer-credit {
      margin-top: 10px;
      font-size: 10px;
      color: rgba(148, 163, 184, 0.8);
      text-align: left;
      direction: ltr;
      line-height: 1.6;
    }

    .footer-credit a {
      color: rgba(148, 163, 184, 0.95);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-credit a:hover {
      text-decoration: underline;
    }

    /* پنجره نمایش عکس تیم‌ها / لوگوها */
    .team-image-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;

async function savePredictionToDB(matchId, homeScore, awayScore, phone) {
  try {
    const username = (getSavedUsername() || "").trim() || null;
    const playerId = getOrCreatePlayerId();

      }
    } catch (_) {
      phoneFromStorage = "";
    }

    const phoneValue =
      (typeof phone === "string" && phone.trim()) ||

    let { error } = await db

      .insert({

      });

        (error.hint || "");

      // اگر مشکل از player_id بود، بدون player_id دوباره امتحان کن
      if (msg.includes("player_id")) {

          .from("predictions")

            home_score: homeScore,

          });

}
// -----------------------------
// آمار پیش‌بینی چند بازی با هم (برای یک هفته)
// خروجی: map مثل statsMap[matchId] = { total, homePercent, drawPercent, awayPercent }
// -----------------------------
async function getPredictionStatsForMatches(matchIds) {
  if (!Array.isArray(matchIds) || !matchIds.length) {
    return {};
  }

  try {
    const { data, error } = await db
      .from("predictions")
      .select("match_id, home_score, away_score")
      .in("match_id", matchIds);

    if (error) {
      console.error("خطا در خواندن آمار پیش‌بینی‌ها (batch):", error);
      return {};
    }

    // گروه‌بندی بر اساس match_id
    const grouped = {};
    (data || []).forEach(p => {
      const mid = p.match_id;
      if (!grouped[mid]) grouped[mid] = [];
      grouped[mid].push(p);
    });

    const statsMap = {};

    Object.keys(grouped).forEach(mid => {
      const list = grouped[mid];

      let homeWins = 0;
      let draws = 0;
      let awayWins = 0;

      list.forEach(p => {
        const hs = Number(p.home_score);
        const as = Number(p.away_score);
        if (Number.isNaN(hs) || Number.isNaN(as)) return;

        if (hs > as) homeWins++;
        else if (hs < as) awayWins++;
        else draws++;
      });

      const total = homeWins + draws + awayWins;
      if (!total) return;

      const homePercent = Math.round((homeWins / total) * 100);
      const drawPercent = Math.round((draws / total) * 100);
      const awayPercent = 100 - homePercent - drawPercent;

      statsMap[mid] = {
        total,
        homePercent,
        drawPercent,
        awayPercent
      };
    });

    return statsMap;
  } catch (e) {
    console.error("استثناء در getPredictionStatsForMatches:", e);
    return {};
  }
}

// -----------------------------
// آمار خلاصهٔ پیش‌بینی‌ها برای یک بازی
// خروجی: null اگر پیش‌بینی‌ای نباشد، وگرنه درصد برد میزبان/مساوی/برد میهمان
// -----------------------------
async function getPredictionStats(matchId) {
  try {
    const { data, error } = await db
      .from("predictions")
      .select("home_score, away_score")
      .eq("match_id", matchId);

    if (error) {
      console.error("خطا در خواندن آمار پیش‌بینی‌ها:", error);
      return null;
    }

    if (!data || !data.length) {
      // هیچ پیش‌بینی‌ای برای این بازی ثبت نشده
      return null;
    }

    let homeWins = 0;
    let draws = 0;
    let awayWins = 0;

    data.forEach(p => {
      const hs = Number(p.home_score);
      const as = Number(p.away_score);
      if (Number.isNaN(hs) || Number.isNaN(as)) return;

      if (hs > as) homeWins++;
      else if (hs < as) awayWins++;
      else draws++;
    });

    const total = homeWins + draws + awayWins;
    if (!total) {
      // همه رکوردها ناسالم بوده یا چیزی برای شمارش نداریم
      return null;
    }

    const homePercent = Math.round((homeWins / total) * 100);
    const drawPercent = Math.round((draws / total) * 100);
    const awayPercent = 100 - homePercent - drawPercent; // جمع حتماً ۱۰۰ بشه

    return {
      total,
      homePercent,
      drawPercent,
      awayPercent
    };
  } catch (e) {
    console.error("استثناء در getPredictionStats:", e);
    return null;
  }
}

  } catch (e) {

}

    function calculateTable() {
      const stats = new Map();
      teams.forEach(team => {
        stats.set(team.id, {
          teamId: team.id,
          played: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          goalsFor: 0,
          goalsAgainst: 0,
          points: 0
        });
      });

      getAllEffectiveMatches()
        .filter(m => m.status === "finished")
        .forEach(match => {
          const homeStat = stats.get(match.homeTeamId);
          const awayStat = stats.get(match.awayTeamId);

          homeStat.played++;
          awayStat.played++;

          homeStat.goalsFor += match.homeScore;
          homeStat.goalsAgainst += match.awayScore;

          awayStat.goalsFor += match.awayScore;
          awayStat.goalsAgainst += match.homeScore;

          if (match.homeScore > match.awayScore) {
            homeStat.wins++;
            awayStat.losses++;
            homeStat.points += 3;
          } else if (match.homeScore < match.awayScore) {
            awayStat.wins++;
            homeStat.losses++;
            awayStat.points += 3;
          } else {
            homeStat.draws++;
            awayStat.draws++;
            homeStat.points++;
            awayStat.points++;
          }
        });

      const tableArray = Array.from(stats.values());
      tableArray.sort((a, b) => {
        const gdA = a.goalsFor - a.goalsAgainst;
        const gdB = b.goalsFor - b.goalsAgainst;
        if (b.points !== a.points) return b.points - a.points;
        if (gdB !== gdA) return gdB - gdA;
        if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
        const teamA = getTeamById(a.teamId).name;
        const teamB = getTeamById(b.teamId).name;
        return teamA.localeCompare(teamB, "fa");
      });

      return tableArray;
    }

        // -----------------------------
    // امتیازدهی پیش‌بینی‌ها (طبق قانون کالیگا)
    // -----------------------------
    function getResultSign(home, away) {
      if (home > away) return 1;   // برد میزبان
      if (home < away) return -1;  // برد میهمان
      return 0;                    // مساوی
    }

    function calcPredictionPoints(realHome, realAway, predHome, predAway) {
      // نتیجه دقیق درست → ۳ امتیاز
      if (predHome === realHome && predAway === realAway) {
        return 3;
      }

      // فقط جهت درست (برد / مساوی / باخت) → ۱ امتیاز
      if (getResultSign(predHome, predAway) === getResultSign(realHome, realAway)) {
        return 1;
      }

      // اشتباه → ۰
      return 0;
    }

    function getPosClass(pos) {
      if (pos <= 4) return "pos-top";
      if (pos >= 10) return "pos-bottom";
      return "pos-mid";
    }

    function renderTablePage() {
      const container = document.getElementById("page-content");

    const MEDIA_BASE = ""; // اگر src را کامل مثل media/img4.jpg می‌نویسی، همین خالی بمونه

async function fetchMediaPosts() {
  const { data, error } = await db
    .from("media_posts")
    .select(`
      id, title, caption, order_index, created_at,
      media_images ( id, post_id, file_path, caption, order_index )
    `)
    .order("order_index", { ascending: true })
    .order("created_at", { ascending: false })
    .order("order_index", { foreignTable: "media_images", ascending: true });

  if (error) {
    console.error("خطا در خواندن پست‌های رسانه:", error);
    return [];
  }

  return data || [];
}


function normalizeMediaSrc(src) {
  const s = (src || "").trim();
  if (!s) return "";
  // اگر لینک کامل بود (http) همون رو برگردون
  if (/^https?:\/\//i.test(s)) return s;
  // اگر مسیر نسبی بود
  return MEDIA_BASE + s;
}

    async function adminSaveMatchResult(matchId) {
      const match = matches.find(m => m.id === matchId);
      if (!match) {
        alert("بازی پیدا نشد.");
        return;
      }

      const homeInput = document.getElementById(`admin-home-score-${matchId}`);
      const awayInput = document.getElementById(`admin-away-score-${matchId}`);
      if (!homeInput || !awayInput) {
        alert("ورودی‌های نتیجه پیدا نشد.");
        return;
      }

      const hs = parseInt(homeInput.value, 10);
      const as = parseInt(awayInput.value, 10);

      if (isNaN(hs) || isNaN(as)) {
        alert("لطفاً برای نتیجه، عدد وارد کن.");
        return;
      }

      const homeScText = (document.getElementById(`admin-home-scorers-${matchId}`)?.value || "").trim();
      const awayScText = (document.getElementById(`admin-away-scorers-${matchId}`)?.value || "").trim();
      const yellowText  = (document.getElementById(`admin-yellow-${matchId}`)?.value || "").trim();
      const redText     = (document.getElementById(`admin-red-${matchId}`)?.value || "").trim();

      try {
        const payload = {
          match_id: matchId,
          home_score: hs,
          away_score: as,
          status: "finished",
          home_scorers: homeScText || null,
          away_scorers: awayScText || null,
          yellow_cards: yellowText || null,
          red_cards: redText || null
        };

        const { error } = await db
          .from("match_results")
          .upsert(payload, { onConflict: "match_id" });

        if (error) {
          console.error("خطا در ذخیره نتیجه بازی:", error);
          alert("در ذخیره نتیجه خطایی رخ داد.");
          return;
        }

        // آپدیت کش لوکال
        matchOverrides[matchId] = {
          match_id: matchId,
          home_score: hs,
          away_score: as,
          status: "finished"
        };

        matchDetailsAdmin[matchId] = {
          homeScorers: homeScText.split("\n").map(s => s.trim()).filter(Boolean),
          awayScorers: awayScText.split("\n").map(s => s.trim()).filter(Boolean),
          yellowCards: yellowText.split("\n").map(s => s.trim()).filter(Boolean),
          redCards: redText.split("\n").map(s => s.trim()).filter(Boolean)
        };

        alert("نتیجه و جزئیات بازی ذخیره شد و روی سایت اعمال شد.");
        renderAdminPredictionsPage(); // رفرش صفحه ادمین تا جدول‌ها هم آپدیت بشن
      } catch (e) {
        console.error("استثناء در adminSaveMatchResult:", e);
        alert("یک خطای غیرمنتظره در ذخیره نتیجه رخ داد.");
      }
    }

async function renderAdminPredictionsPage() {
  const container = document.getElementById("page-content");
  if (!container) return;

  container.innerHTML = `
    <div class="section-title">
      <span class="dot"></span>
      <span>گزارش ادمین - امتیاز و فعالیت پیش‌بینی‌ها</span>
    </div>
    <div class="card">در حال بارگذاری اطلاعات پیش‌بینی‌ها...</div>
  `;

  try {
    // همهٔ پیش‌بینی‌ها (ستون‌ها رو آزاد می‌گیریم تا اگه player_id یا phone نباشه، خطا نده)
    const { data, error } = await db
      .from("predictions")
      .select("*");

    if (error) {
      console.error("خطا در خواندن داده‌های پیش‌بینی:", error);
      container.innerHTML = `
        <div class="section-title">
          <span class="dot"></span>
          <span>گزارش ادمین - امتیاز و فعالیت پیش‌بینی‌ها</span>
        </div>
        <div class="card">
          در خواندن داده‌های پیش‌بینی مشکلی پیش آمد.<br/>
          جزئیات در کنسول مرورگر (F12) قابل مشاهده است.
        </div>
      `;
      return;
    }

    if (!data || !data.length) {
      container.innerHTML = `
        <div class="section-title">
          <span class="dot"></span>
          <span>گزارش ادمین - امتیاز و فعالیت پیش‌بینی‌ها</span>
        </div>
        <div class="card">
          هنوز هیچ پیش‌بینی‌ای در دیتابیس ثبت نشده است.
        </div>
      `;
      return;
    }

    // فقط بازی‌های تمام‌شده برای محاسبه امتیاز
    const finishedMatchesMap = new Map();
    getAllEffectiveMatches()
      .filter(m => m.status === "finished")
      .forEach(m => finishedMatchesMap.set(m.id, m));

    // ۱) آمار امتیاز پیش‌بینی برای بازی‌های تمام‌شده
    const scoreByUser = new Map();

    // ۲) آمار تعداد کل پیش‌بینی‌ها (برای همهٔ بازی‌ها)
    const countByUser = new Map();

    data.forEach(pred => {
      const username = (pred.username || "").trim() || "بدون نام‌کاربری";
      const phone = (pred.phone || "").trim();

      // --- ۲) شمارش کل پیش‌بینی‌ها ---
      if (!countByUser.has(username)) {
        countByUser.set(username, {
          username,
          phone: phone || "",
          totalPredictions: 0
        });
      } else if (phone && !countByUser.get(username).phone) {
        // اگر قبلاً شماره نداشت و حالا داریم، ذخیره کن
        countByUser.get(username).phone = phone;
      }
      countByUser.get(username).totalPredictions += 1;

      // --- ۱) فقط اگر بازی تمام شده، امتیاز حساب می‌کنیم ---
      const match = finishedMatchesMap.get(pred.match_id);
      if (!match) return;

      if (!scoreByUser.has(username)) {
        scoreByUser.set(username, {
          username,
          phone: phone || "",
          predictionsCount: 0,
          correctResultCount: 0,
          exactScoreCount: 0,
          totalPoints: 0
        });
      } else if (phone && !scoreByUser.get(username).phone) {
        scoreByUser.get(username).phone = phone;
      }

      const row = scoreByUser.get(username);

      // استفاده از تابع امتیازدهی سراسری (که بالاتر تعریف کردی)
      const points = calcPredictionPoints(
        match.homeScore,
        match.awayScore,
        pred.home_score,
        pred.away_score
      );

      row.predictionsCount += 1;
      if (points > 0) row.correctResultCount += 1;
      if (points === 3) row.exactScoreCount += 1;
      row.totalPoints += points;
    });

    // آرایه‌ها برای نمایش
    const scoreRows = Array.from(scoreByUser.values());
    const countRows = Array.from(countByUser.values());

    // مرتب‌سازی جدول امتیاز
    scoreRows.sort((a, b) => {
      if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
      if (b.correctResultCount !== a.correctResultCount) return b.correctResultCount - a.correctResultCount;
      if (b.exactScoreCount !== a.exactScoreCount) return b.exactScoreCount - a.exactScoreCount;
      return b.predictionsCount - a.predictionsCount;
    });

    // مرتب‌سازی جدول تعداد پیش‌بینی‌ها
    countRows.sort((a, b) => {
      if (b.totalPredictions !== a.totalPredictions) {
        return b.totalPredictions - a.totalPredictions;
      }
      return a.username.localeCompare(b.username, "fa");
    });

    // ساخت HTML نهایی
    let html = `
      <div class="section-title">
        <span class="dot"></span>
        <span>گزارش ادمین - امتیاز و فعالیت پیش‌بینی‌ها</span>
      </div>

      <div class="card">
        <div style="font-size:12px;margin-bottom:8px;">
          سلام.
        </div>
    `;

    // 🔹 بخش اول: جدول امتیاز پیش‌بینی‌ها (فقط بازی‌های تمام‌شده)
    if (!scoreRows.length) {
      html += `
        <div style="font-size:12px;color:var(--text-soft);margin-bottom:4px;">
          هنوز هیچ پیش‌بینیِ قابل امتیازدهی برای بازی‌های تمام‌شده ثبت نشده است.
        </div>
      `;
    } else {
      html += `
        <div style="font-weight:600;font-size:13px;margin-bottom:6px;">🏆 جدول امتیاز پیش‌بینی‌ها (بازی‌های تمام‌شده)</div>
        <div class="table-wrapper" style="margin-top:6px;">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>نام کاربری</th>
                <th>شماره تماس</th>
                <th>تعداد پیش‌بینی (بازی تمام‌شده)</th>
                <th>نتیجه درست</th>
                <th>نتیجه و اسکور دقیق (۳ امتیازی)</th>
                <th>امتیاز کل</th>
              </tr>
            </thead>
            <tbody>
      `;

      scoreRows.forEach((r, idx) => {
        html += `
          <tr>
            <td>${idx + 1}</td>
            <td>${escapeHtml(r.username)}</td>
            <td>${escapeHtml(r.phone || "")}</td>
            <td>${r.predictionsCount}</td>
            <td>${r.correctResultCount}</td>
            <td>${r.exactScoreCount}</td>
            <td>${r.totalPoints}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;
    }

    html += `</div>`; // پایان کارت اول

    // 🔹 بخش دوم: جدول تعداد کل پیش‌بینی‌های هر کاربر
    html += `
      <div class="card">
        <div style="font-weight:600;font-size:13px;margin-bottom:6px;">📊 فعالیت کاربران در پیش‌بینی (همهٔ بازی‌ها)</div>
        <div style="font-size:11px;color:var(--text-soft);margin-bottom:6px;">
          این جدول صرفاً تعداد پیش‌بینی‌های ثبت‌شده توسط هر نام کاربری را نشان می‌دهد؛
          چه بازی انجام شده باشد چه هنوز برگزار نشده باشد.
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>نام کاربری</th>
                <th>شماره تماس</th>
                <th>تعداد کل پیش‌بینی‌ها</th>
              </tr>
            </thead>
            <tbody>
    `;

    countRows.forEach((r, idx) => {
      html += `
        <tr>
          <td>${idx + 1}</td>
          <td>${escapeHtml(r.username)}</td>
          <td>${escapeHtml(r.phone || "")}</td>
          <td>${r.totalPredictions}</td>

    const allMatchesEffective = getAllEffectiveMatches();

async function handlePrediction(matchId) {
  const baseMatch = matches.find(m => m.id === matchId);
  if (!baseMatch) return;

  const match = getEffectiveMatch(baseMatch);

  // اگر بازی با override تمام شده، اجازه پیش‌بینی نده
  if (match.status === "finished") {
    alert("این بازی به پایان رسیده و امکان ثبت پیش‌بینی ندارد.");
    return;
  }

  // چک کنیم مهلت پیش‌بینی تموم نشده
  if (!isPredictionOpen(match)) {
    alert("مهلت پیش‌بینی برای این بازی تمام شده است.");
    return;
  }
  const home = getTeamById(match.homeTeamId);
  const away = getTeamById(match.awayTeamId);

  // ۲) مطمئن بشیم کاربر نام کاربری داره
  //    و در صورت تمایل شماره تماس هم بپرسیم
  const identity = ensureUsernameForPrediction();
  if (!identity) {
    // اگر کاربر نام وارد نکرد، ثبت پیش‌بینی رو کنسل می‌کنیم
    return;
  }

  const { username, phone } = identity; // phone فعلاً فقط برای ذخیره تو DB است

  // ۳) گرفتن اسکور از کاربر
  let hs = prompt(`گل‌های ${home.name} را برای پیش‌بینی وارد کن:`, "0");
  if (hs === null) return;
  let as = prompt(`گل‌های ${away.name} را برای پیش‌بینی وارد کن:`, "0");
  if (as === null) return;

  hs = parseInt(hs, 10);
  as = parseInt(as, 10);

  if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0) {
    alert("لطفاً فقط عدد صحیح مثبت وارد کن.");
    return;
  }

  // ۴) ذخیره پیش‌بینی، همراه با شماره تماس (اگر کاربر داده باشد)
  await savePredictionToDB(matchId, hs, as, phone);
  alert("پیش‌بینی شما ذخیره شد.");

  setActivePage("fixtures");
}

      root.style.setProperty("--bg", theme.bg);

      root.style.setProperty("--card", theme.card);

      root.style.setProperty("--border", theme.border);

      document.body.style.background =
        `radial-gradient(circle at top, ${theme.bgSoft}, ${theme.bg} 55%)`;

      const list = getCurrentThemeList();
      if (!list.length) return;
      currentThemeIndex = (currentThemeIndex + 1) % list.length;
      applyTheme(list[currentThemeIndex]);

  setMode("dark");

  await loadMatchOverrides();

  // بقیه همون قبلی خودت:

    });
  });

  const isAdminMode = params.get("admin") === "1";

  if (isAdminMode) {
    const ok = checkAdminAccess();
    if (ok) {
      renderAdminPredictionsPage();
    } else {
      setActivePage("results");
    }
  } else {
    setActivePage("results");
  }

  updateCurrentDateTime();
  setInterval(updateCurrentDateTime, 1000);

    modeToggle.addEventListener("click", () => {
      setMode(currentMode === "dark" ? "light" : "dark");
    });
  }

  const audio = document.getElementById("bg-audio");
  const audioToggle = document.getElementById("audio-toggle");

  if (audio && audioToggle) {
    audio.volume = 0.4;
    audio.play().catch(() => {});

    function updateAudioButton() {
      if (audio.paused) {
        audioToggle.textContent = "🔈 موسیقی خاموش";
        audioToggle.classList.remove("active");
      } else {
        audioToggle.textContent = "🔊 موسیقی روشن";
        audioToggle.classList.add("active");
      }
    }

    updateAudioButton();

    audioToggle.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
      updateAudioButton();
    });
  }

  const introVideo = document.getElementById("intro-video");
  if (introVideo) {
    introVideo.play().catch(() => {});
  }
  setTimeout(() => {
    hideIntro();
  }, 3000);

  const menuToggle = document.getElementById("menu-toggle");
  if (menuToggle) {
    menuToggle.addEventListener("click", openSideMenu);
  }

  incrementPageView();
});
