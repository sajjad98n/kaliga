<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لیگ فوتسال روستای چاشم</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- فونت فارسی Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #151a2c;
      --card: #1d2236;
      --accent: #18a34a;
      --accent-soft: rgba(24, 163, 74, 0.2);
      --text: #f9fafb;
      --text-soft: #a1a5b5;
      --danger: #ef4444;
      --border: #262c46;
      --radius-lg: 18px;
      --radius-full: 999px;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      font-family: "Vazirmatn", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #1d2545, #050816 55%);
      color: var(--text);
    }

    .app {
      max-width: 1100px;
      margin: 24px auto 40px;
      padding: 0 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 16px;
      background: conic-gradient(from 160deg, #18a34a, #06b6d4, #6366f1, #18a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
    }

    .brand-logo span {
      font-weight: 800;
      font-size: 18px;
    }

    .brand-text-title {
      font-size: 22px;
      font-weight: 700;
    }

    .brand-text-sub {
      font-size: 13px;
      color: var(--text-soft);
    }

    .header-right {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      font-size: 12px;
      color: var(--text-soft);
    }

    .live-pill {
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 11px;
    }

    .audio-toggle {
      margin-top: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
    }

    .audio-toggle.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(34, 197, 94, 0.8);
    }

    nav {
      display: flex;
      gap: 8px;
      padding: 4px;
      background: rgba(9, 12, 24, 0.85);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(56, 63, 99, 0.8);
      box-shadow: var(--shadow-soft);
      margin-bottom: 18px;
      backdrop-filter: blur(14px);
    }

    nav button {
      flex: 1;
      border-radius: 999px;
      border: none;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      transition: 0.18s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    nav button .nav-icon {
      font-size: 16px;
    }

    nav button .nav-label {
      white-space: nowrap;
    }

    nav button.active {
      background: linear-gradient(135deg, #18a34a, #22c55e);
      color: #ecfdf3;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.55);
    }

    nav button.active .nav-icon {
      filter: drop-shadow(0 0 6px rgba(22, 163, 74, 0.8));
    }

    nav button:hover:not(.active) {
      background: rgba(37, 44, 79, 0.75);
      color: var(--text);
    }

    main {
      margin-top: 14px;
    }

    .section-title {
      font-size: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span.dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
    }

    .card {
      background: radial-gradient(circle at top left, #242b46, #111425 55%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .match-row {
      display: grid;
      grid-template-columns: 1.2fr auto 1.2fr;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .team-side {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-home {
      justify-content: flex-start;
    }

    .team-away {
      justify-content: flex-end;
    }

    .match-meta {
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }

    .team-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-name {
      font-weight: 500;
    }

    .team-logo {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #f9fafb;
      border: 1px solid rgba(15, 23, 42, 0.6);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.5);
    }

    .match-center {
      text-align: center;
    }

    .match-score {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .match-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-top: 2px;
    }

    .status-finished {
      background: rgba(37, 99, 235, 0.12);
      color: #60a5fa;
    }

    .status-live {
      background: rgba(248, 113, 113, 0.1);
      color: #f87171;
    }

    .status-upcoming {
      background: rgba(148, 163, 184, 0.12);
      color: #e5e7eb;
    }

    /* پیش‌بینی‌ها */
    .prediction-summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-soft);
    }

    .prediction-bars {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .prediction-bar {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      height: 16px;
    }

    .prediction-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      border-radius: 999px;
    }

    .prediction-fill-home {
      background: rgba(34, 197, 94, 0.5);
    }

    .prediction-fill-draw {
      background: rgba(148, 163, 184, 0.6);
    }

    .prediction-fill-away {
      background: rgba(59, 130, 246, 0.5);
    }

    .prediction-label {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 10px;
      line-height: 16px;
    }

    /* اکشن‌ها و کامنت‌ها */
    .match-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .action-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-soft);
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(30, 64, 175, 0.7);
      color: #e5e7eb;
    }

    .comments-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.4);
    }

    .comments-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 6px;
    }

    .comment-item {
      margin-bottom: 6px;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.85);
    }

    .comment-header {
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: 2px;
    }

    .comment-body {
      font-size: 12px;
    }

    .comment-empty {
      font-size: 11px;
      color: var(--text-soft);
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .comment-username {
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
    }

    .comment-username input {
      flex: 1;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 11px;
    }

    .comment-form textarea {
      resize: vertical;
      min-height: 40px;
      padding: 4px 6px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 12px;
    }

    .comment-form button {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ecfdf3;
      font-size: 11px;
      cursor: pointer;
    }

    .table-wrapper {
      background: radial-gradient(circle at top left, #202744, #101322 58%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 8px 0 4px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      background: rgba(15, 23, 42, 0.95);
    }

    th, td {
      padding: 7px 10px;
      text-align: center;
      border-bottom: 1px solid rgba(31, 41, 55, 0.9);
    }

    th:first-child, td:first-child {
      text-align: right;
    }

    th {
      font-weight: 600;
      color: var(--text-soft);
    }

    tbody tr:nth-child(even) {
      background: rgba(15, 23, 42, 0.7);
    }

    tbody tr:nth-child(odd) {
      background: rgba(15, 23, 42, 0.4);
    }

    .pos-pill {
      min-width: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 0;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .pos-top {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
    }

    .pos-mid {
      background: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
    }

    .pos-bottom {
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-name-sm {
      font-size: 12px;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .team-card {
      background: radial-gradient(circle at top, #252b42, #121626 58%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .team-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      color: var(--text-soft);
    }

    .tip-box {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-soft);
      border-radius: 14px;
      border: 1px dashed rgba(148, 163, 184, 0.6);
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.7);
    }

    .tip-box code {
      background: rgba(15, 23, 42, 0.9);
      padding: 2px 4px;
      border-radius: 6px;
      direction: ltr;
      display: inline-block;
      font-size: 10px;
    }

    @media (max-width: 680px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-right {
        align-items: flex-start;
      }
      .match-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .team-away {
        justify-content: flex-start;
      }
      .match-center {
        justify-self: flex-start;
        text-align: right;
      }
      .match-meta {
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- آهنگ پس‌زمینه: فایل music.mp3 را کنار index.html قرار بده -->
    <audio id="bg-audio" src="music.mp3" loop></audio>

    <header>
      <div class="brand">
        <div class="brand-logo">
          <span>LM</span>
        </div>
        <div>
          <div class="brand-text-title">کالیگا</div>
          <div class="brand-text-sub">لیگ فوتسال روستای چاشم</div>
        </div>
      </div>
      <div class="header-right">
        <div>فصل ۱۴۰۴ / ۲۰۲۵</div>
        <div>به‌روزرسانی نمونه دیتا برای تست</div>
        <div class="live-pill">نمایش دمو • استاتیک</div>
        <button id="audio-toggle" class="audio-toggle">🔈 موسیقی خاموش</button>
      </div>
    </header>

    <nav>
      <button class="tab-btn active" data-page="fixtures">
        <span class="nav-icon">📅</span>
        <span class="nav-label">برنامه بازی‌ها</span>
      </button>
      <button class="tab-btn" data-page="results">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">نتایج</span>
      </button>
      <button class="tab-btn" data-page="table">
        <span class="nav-icon">📊</span>
        <span class="nav-label">جدول لیگ</span>
      </button>
      <button class="tab-btn" data-page="teams">
        <span class="nav-icon">👥</span>
        <span class="nav-label">تیم‌ها</span>
      </button>
    </nav>

    <main id="page-content">
      <!-- محتوا با جاوااسکریپت تزریق می‌شود -->
    </main>

    <div class="tip-box">
      <strong>راهنمای سریع:</strong> بازی‌های آینده و گذشته در آرایه <code>matches</code> تعریف می‌شوند.  
      برای هر هفته‌ی جدید، یک آبجکت با <code>week</code>، تیم‌ها، تاریخ، ساعت و <code>status</code> بسازید.
    </div>
  </div>

  <script>
  const { createClient } = supabase;

  const SUPABASE_URL = "YOUR_SUPABASE_URL";          // مثلا: https://abcdxyz.supabase.co
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; // anon key خودت

  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------- تیم‌ها ----------
  const teams = [
    { id: 1,  name: "کافه لوین",                   shortName: "LVN",  color: "#0ea5e9" },
    { id: 2,  name: "استودیو نامبر وان",           shortName: "NUO",  color: "#22c55e" },
    { id: 3,  name: "زنده یاد سید مهدی نبوی",      shortName: "SMN",  color: "#f97316" },
    { id: 4,  name: "زنده یاد مجید جعفری",        shortName: "MJA",  color: "#a855f7" },
    { id: 5,  name: "زنده یاد بهمن و مصطفی جعفری", shortName: "BMJ",  color: "#eab308" },
    { id: 6,  name: "پیشکسوتان نیزوا",            shortName: "NZV",  color: "#ec4899" },
    { id: 7,  name: "زنده یاد محمدرضا جعفری",     shortName: "MRJ",  color: "#6366f1" },
    { id: 8,  name: "شهید نجفعلی قادری",          shortName: "NGH",  color: "#14b8a6" },
    { id: 9,  name: "زنده یاد هادی قادری",        shortName: "HGH",  color: "#facc15" },
    { id: 10, name: "امامزاده پیش",               shortName: "EZP",  color: "#4ade80" },
    { id: 11, name: "شهید سید احسان موسوی",       shortName: "SEM",  color: "#fb7185" },
    { id: 12, name: "هیئت جوانان",                shortName: "JVN",  color: "#2dd4bf" }
  ];

  // ---------- بازی‌ها (دیتای نمونه) ----------
  const matches = [
    { id: 1, week: 1, homeTeamId: 3,  awayTeamId: 10, date: "1404-08-30", time: "15:00", stadium: "سالن شهید صحافی", status: "finished", homeScore: 3, awayScore: 0 },
    { id: 2, week: 1, homeTeamId: 2,  awayTeamId: 11, date: "1404-08-30", time: "15:45", stadium: "سالن شهید صحافی", status: "finished", homeScore: 3, awayScore: 0 },
    { id: 3, week: 1, homeTeamId: 9,  awayTeamId: 4,  date: "1404-08-30", time: "16:50", stadium: "سالن شهید صحافی", status: "finished", homeScore: 2, awayScore: 4 },
    { id: 4, week: 1, homeTeamId: 7,  awayTeamId: 5,  date: "1404-08-30", time: "17:45", stadium: "سالن شهید صحافی", status: "finished", homeScore: 1, awayScore: 2 },
    { id: 5, week: 1, homeTeamId: 12, awayTeamId: 1,  date: "1404-08-30", time: "18:30", stadium: "سالن شهید صحافی", status: "finished", homeScore: 1, awayScore: 5 },
    { id: 6, week: 1, homeTeamId: 6,  awayTeamId: 8,  date: "1404-08-30", time: "19:15", stadium: "سالن شهید صحافی", status: "finished", homeScore: 1, awayScore: 0 },

    { id: 7, week: 2, homeTeamId: 1, awayTeamId: 2, date: "1404-09-01", time: "15:00", stadium: "سالن شهید صحافی", status: "upcoming", homeScore: null, awayScore: null },
    { id: 8, week: 2, homeTeamId: 3, awayTeamId: 4, date: "1404-09-01", time: "15:45", stadium: "سالن شهید صحافی", status: "upcoming", homeScore: null, awayScore: null },
    { id: 9, week: 3, homeTeamId: 5, awayTeamId: 6, date: "1404-09-05", time: "16:00", stadium: "سالن شهید صحافی", status: "upcoming", homeScore: null, awayScore: null }
  ];

  // ---------- توابع ساده ----------
  function getTeamById(id) {
    return teams.find(t => t.id === id);
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split("-");
    return `${d} / ${m}`;
  }

  function getStatusLabel(status) {
    if (status === "finished") return "پایان یافته";
    if (status === "live")     return "زنده";
    return "بازی آتی";
  }

  function getStatusClass(status) {
    if (status === "finished") return "status-finished";
    if (status === "live")     return "status-live";
    return "status-upcoming";
  }

  // ---------- نام کاربری لوکال ----------
  const USERNAME_KEY = "kaliga_username";
  function getSavedUsername() { return localStorage.getItem(USERNAME_KEY) || ""; }
  function setSavedUsername(n) { localStorage.setItem(USERNAME_KEY, n); }

  // ---------- پیش‌بینی در Supabase ----------
  async function savePredictionToDB(matchId, homeScore, awayScore) {
    try {
      const username = getSavedUsername() || null;
      const { error } = await db
        .from("predictions")
        .insert({ match_id: matchId, username, home_score: homeScore, away_score: awayScore });

      if (error) {
        console.error(error);
        alert("خطا در ذخیره پیش‌بینی");
      }
    } catch (e) {
      console.error(e);
      alert("مشکل ارتباط با سرور");
    }
  }

  async function getPredictionStats(matchId) {
    try {
      const { data, error } = await db
        .from("predictions")
        .select("home_score, away_score")
        .eq("match_id", matchId);

      if (error) {
        console.error(error);
        return null;
      }
      if (!data || data.length === 0) return null;

      let home = 0, draw = 0, away = 0;
      data.forEach(r => {
        if (r.home_score > r.away_score) home++;
        else if (r.home_score < r.away_score) away++;
        else draw++;
      });

      const total = data.length;
      return {
        total,
        homePercent: Math.round(home * 100 / total),
        drawPercent: Math.round(draw * 100 / total),
        awayPercent: Math.round(away * 100 / total)
      };
    } catch (e) {
      console.error(e);
      return null;
    }
  }

  // ---------- کامنت‌ها ----------
  async function fetchComments(matchId) {
    try {
      const { data, error } = await db
        .from("comments")
        .select("id, username, body, created_at")
        .eq("match_id", matchId)
        .order("created_at", { ascending: true });

      if (error) {
        console.error(error);
        return [];
      }
      return data || [];
    } catch (e) {
      console.error(e);
      return [];
    }
  }

  async function addComment(matchId, text) {
    const username = getSavedUsername().trim();
    if (!username) {
      alert("اول نام کاربری ذخیره کن");
      return;
    }
    if (!text.trim()) return;

    try {
      const { error } = await db
        .from("comments")
        .insert({ match_id: matchId, username, body: text.trim() });

      if (error) {
        console.error(error);
        alert("خطا در ثبت کامنت");
      }
    } catch (e) {
      console.error(e);
      alert("مشکل ارتباط با سرور");
    }
  }

  async function loadAndRenderComments(matchId) {
    const box = document.getElementById(`comments-${matchId}`);
    if (!box) return;

    const list = await fetchComments(matchId);
    const username = getSavedUsername();

    let html = `
      <div style="margin-bottom:6px;font-size:11px;color:#a1a5b5">
        برای ثبت نظر، نام کاربری انتخاب کن و بعد متن نظر را ارسال کن.
      </div>
      <div style="display:flex;gap:6px;margin-bottom:6px;">
        <input id="username-input-${matchId}" placeholder="نام کاربری"
          value="${username}"
          style="flex:1;padding:4px 8px;border-radius:999px;border:1px solid #4b5563;background:#020617;color:#e5e7eb;font-size:11px;">
        <button onclick="saveUsernameFromInput(${matchId})"
          style="padding:4px 10px;border-radius:999px;border:none;background:#22c55e;font-size:11px;cursor:pointer;">
          ذخیره نام
        </button>
      </div>
      <textarea id="comment-input-${matchId}" rows="2"
        style="width:100%;padding:4px 8px;border-radius:10px;border:1px solid #4b5563;background:#020617;color:#e5e7eb;font-size:12px;margin-bottom:4px;"
        placeholder="نظر خود را درباره این بازی بنویسید..."></textarea>
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
        <button onclick="submitComment(${matchId})"
          style="padding:4px 10px;border-radius:999px;border:none;background:#0ea5e9;font-size:11px;color:#e0f2fe;cursor:pointer;">
          ارسال نظر
        </button>
      </div>
    `;

    if (list.length === 0) {
      html += `<div style="font-size:11px;color:#9ca3af;border:1px dashed #4b5563;border-radius:10px;padding:6px 8px;">
        هنوز نظری ثبت نشده است.
      </div>`;
    } else {
      html += `<div style="display:flex;flex-direction:column;gap:6px;">`;
      list.forEach(c => {
        html += `
          <div style="border-radius:10px;border:1px solid #1f2937;padding:6px 8px;background:#020617;">
            <div style="font-size:11px;color:#9ca3af;margin-bottom:2px;">
              <strong style="color:#e5e7eb;">${c.username}</strong>
              <span style="opacity:.7;"> • ${new Date(c.created_at).toLocaleString("fa-IR")}</span>
            </div>
            <div style="font-size:12px;color:#e5e7eb;">${c.body}</div>
          </div>
        `;
      });
      html += `</div>`;
    }

    box.innerHTML = html;
  }

  function toggleComments(matchId) {
    const wrap = document.getElementById(`comments-box-${matchId}`);
    if (!wrap) return;
    const isHidden = !wrap.style.display || wrap.style.display === "none";
    if (isHidden) {
      wrap.style.display = "block";
      loadAndRenderComments(matchId);
    } else {
      wrap.style.display = "none";
    }
  }

  function saveUsernameFromInput(matchId) {
    const inp = document.getElementById(`username-input-${matchId}`);
    if (!inp) return;
    const val = inp.value.trim();
    if (!val) { alert("نام کاربری خالی است."); return; }
    setSavedUsername(val);
    alert("نام کاربری ذخیره شد.");
  }

  async function submitComment(matchId) {
    const ta = document.getElementById(`comment-input-${matchId}`);
    if (!ta) return;
    const txt = ta.value;
    await addComment(matchId, txt);
    ta.value = "";
    await loadAndRenderComments(matchId);
  }

  function calculateTable() {
    const stats = new Map();
    teams.forEach(team => {
      stats.set(team.id, {
        teamId: team.id,
        played: 0,
        wins: 0,
        draws: 0,
        losses: 0,
        goalsFor: 0,
        goalsAgainst: 0,
        points: 0
      });
    });

    matches.filter(m => m.status === "finished").forEach(match => {
      const home = stats.get(match.homeTeamId);
      const away = stats.get(match.awayTeamId);

      home.played++; away.played++;
      home.goalsFor += match.homeScore;
      home.goalsAgainst += match.awayScore;
      away.goalsFor += match.awayScore;
      away.goalsAgainst += match.homeScore;

      if (match.homeScore > match.awayScore) {
        home.wins++; away.losses++; home.points += 3;
      } else if (match.homeScore < match.awayScore) {
        away.wins++; home.losses++; away.points += 3;
      } else {
        home.draws++; away.draws++; home.points++; away.points++;
      }
    });

    const arr = Array.from(stats.values());
    arr.sort((a, b) => {
      const gdA = a.goalsFor - a.goalsAgainst;
      const gdB = b.goalsFor - b.goalsAgainst;
      if (b.points !== a.points) return b.points - a.points;
      if (gdB !== gdA) return gdB - gdA;
      if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
      const nameA = getTeamById(a.teamId).name;
      const nameB = getTeamById(b.teamId).name;
      return nameA.localeCompare(nameB, "fa");
    });
    return arr;
  }

  function getPosClass(pos) {
    if (pos <= 4) return "pos-top";
    if (pos >= 10) return "pos-bottom";
    return "pos-mid";
  }

  function renderTablePage() {
    const container = document.getElementById("page-content");
    const data = calculateTable();

    let html = `

    data.forEach((row, idx) => {

  async function handlePrediction(matchId) {
    const hi = document.getElementById(`home-score-${matchId}`);
    const ai = document.getElementById(`away-score-${matchId}`);
    if (!hi || !ai) return;
    const hs = parseInt(hi.value, 10);
    const as = parseInt(ai.value, 10);
    if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0) {
      alert("نتیجه را به صورت عدد مثبت وارد کن.");
      return;
    }
    await savePredictionToDB(matchId, hs, as);
    alert("پیش‌بینی شما ذخیره شد.");
    setActivePage("fixtures");
  }

  function setActivePage(page) {
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.page === page);
    });
    if (page === "fixtures") renderFixturesPage();
    else if (page === "results") renderResultsPage();
    else if (page === "table") renderTablePage();
    else if (page === "teams") renderTeamsPage();
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        setActivePage(btn.dataset.page);
      });
    });
    setActivePage("fixtures");
  });
</script>
