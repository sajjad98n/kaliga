<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لیگ فوتسال روستای چاشم</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- فونت فارسی Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* پالت الهام‌گرفته از لیگ قهرمانان */
      --bg: #020617;                 
      --bg-soft: #050b24;            
      --card: #050b30;               
      --accent: #38bdf8;             
      --accent-soft: rgba(56, 189, 248, 0.18);
      --text: #f9fafb;
      --text-soft: #a5b4fc;
      --danger: #f97373;
      --border: rgba(129, 140, 248, 0.4);
      --radius-lg: 18px;
      --radius-full: 999px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.85);
    }

    * {
      box-sizing: border-box;
      font-family: "Vazirmatn", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* 🔵 این همون قسمتیه که برات ادیت کردم (بکگراند توپ لیگ قهرمانان) */
    body {
      margin: 0;
      padding: 0;

      /* رنگ پایه */
      background-color: #020617;

      /* گرادیِنت‌ها + عکس توپ */
      background-image:
        radial-gradient(circle at 10% 0, rgba(56, 189, 248, 0.25), transparent 55%),
        radial-gradient(circle at 90% 0, rgba(129, 140, 248, 0.32), transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(59, 130, 246, 0.35), transparent 60%),
        url("ucl-ball.png"); /* توپ لیگ قهرمانان */

      background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;

      /* جای لایه‌ها: سه‌تا نور، توپ وسط بالا */
      background-position:
        10% 0,
        90% 0,
        50% 100%,
        center 20%;

      /* سایز: توپ نسبتاً بزرگ */
      background-size:
        auto,
        auto,
        auto,
        1550px auto;

      color: var(--text);
      min-height: 100vh;
    }

    .app {
      max-width: 1100px;
      margin: 24px auto 40px;
      padding: 0 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 65px;
      height: 65px;
      border-radius: 22px;
      background: radial-gradient(circle at 30% 0, rgba(56, 189, 248, 0.5), transparent 55%),
                  radial-gradient(circle at 80% 120%, rgba(168, 85, 247, 0.6), transparent 55%),
                  #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.6);
      overflow: hidden;
      padding: 4px;
      border: 1px solid rgba(129, 140, 248, 0.7);
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-text-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #e5e7eb;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    }

    .brand-text-sub {
      font-size: 13px;
      color: var(--text-soft);
    }

    .header-right {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      font-size: 12px;
      color: var(--text-soft);
    }

    .live-pill {
      padding: 2px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(8, 47, 73, 0.6), rgba(37, 99, 235, 0.7));
      color: #e0f2fe;
      font-weight: 600;
      font-size: 11px;
      box-shadow: 0 0 18px rgba(59, 130, 246, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.7);
    }

    .audio-toggle {
      margin-top: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.85));
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .audio-toggle.active {
      background: radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.4), rgba(15, 23, 42, 0.95));
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.9);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
    }

    nav {
      display: flex;
      gap: 8px;
      padding: 4px;
      background: radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.18), rgba(15, 23, 42, 0.95));
      border-radius: var(--radius-lg);
      border: 1px solid rgba(129, 140, 248, 0.7);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.9);
      margin-bottom: 18px;
      backdrop-filter: blur(16px);
    }

    nav button {
      flex: 1;
      border-radius: 999px;
      border: none;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      transition: 0.18s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    nav button .nav-icon {
      font-size: 16px;
      filter: drop-shadow(0 0 6px rgba(15, 23, 42, 0.8));
    }

    nav button .nav-label {
      white-space: nowrap;
    }

    nav button.active {
      background: radial-gradient(circle at 0 0, #38bdf8, #4f46e5);
      color: #ecfeff;
      box-shadow: 0 10px 26px rgba(56, 189, 248, 0.7);
    }

    nav button.active .nav-icon {
      filter: drop-shadow(0 0 10px rgba(248, 250, 252, 0.9));
    }

    nav button:hover:not(.active) {
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
    }

    main {
      margin-top: 14px;
    }

    .section-title {
      font-size: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span.dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
    }

    .card {
      background:
        radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.18), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(129, 140, 248, 0.24), transparent 55%),
        #020617;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(51, 65, 85, 0.9);
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.95);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .match-row {
      display: grid;
      grid-template-columns: 1.2fr auto 1.2fr;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .team-side {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-home {
      justify-content: flex-start;
    }

    .team-away {
      justify-content: flex-end;
    }

    .match-meta {
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }

    .team-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-name {
      font-weight: 500;
    }

    .team-logo {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #f9fafb;
      border: 1px solid rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.7),
                  0 0 18px rgba(37, 99, 235, 0.7);
    }

    .match-center {
      text-align: center;
    }

    .match-score {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
      color: #e5e7eb;
      text-shadow: 0 0 10px rgba(248, 250, 252, 0.9);
    }

    .match-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-top: 2px;
    }

    .status-finished {
      background: rgba(37, 99, 235, 0.2);
      color: #bfdbfe;
      border: 1px solid rgba(59, 130, 246, 0.6);
    }

    .status-live {
      background: rgba(236, 72, 153, 0.18);
      color: #f9a8d4;
      border: 1px solid rgba(236, 72, 153, 0.7);
      box-shadow: 0 0 14px rgba(236, 72, 153, 0.9);
    }

    .status-upcoming {
      background: rgba(148, 163, 184, 0.18);
      color: #e5e7eb;
      border: 1px solid rgba(148, 163, 184, 0.6);
    }

    .prediction-summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-soft);
    }

    .prediction-bars {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .prediction-bar {
      flex: 1;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      height: 16px;
      border: 1px solid rgba(75, 85, 99, 0.8);
    }

    .prediction-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      border-radius: 999px;
    }

    .prediction-fill-home {
      background: linear-gradient(90deg, rgba(74, 222, 128, 0.8), rgba(22, 163, 74, 0.9));
    }

    .prediction-fill-draw {
      background: linear-gradient(90deg, rgba(148, 163, 184, 0.85), rgba(148, 163, 184, 0.95));
    }

    .prediction-fill-away {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.85), rgba(30, 64, 175, 0.95));
    }

    .prediction-label {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 10px;
      line-height: 16px;
    }

    .match-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .action-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: radial-gradient(circle at 0 0, rgba(30, 64, 175, 0.9), rgba(15, 23, 42, 0.98));
      color: var(--text-soft);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn:hover {
      background: radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.8), rgba(30, 64, 175, 1));
      color: #ecfeff;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
    }

    .comments-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.4);
    }

    .comments-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 6px;
    }

    .comment-item {
      margin-bottom: 6px;
      padding: 6px 8px;
      border-radius: 10px;
      background: radial-gradient(circle at 0 0, rgba(79, 70, 229, 0.4), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(129, 140, 248, 0.6);
    }

    .comment-header {
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: 2px;
    }

    .comment-body {
      font-size: 12px;
      color: #e5e7eb;
    }

    .comment-empty {
      font-size: 11px;
      color: var(--text-soft);
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .comment-username {
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
    }

    .comment-username input {
      flex: 1;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      background: rgba(15, 23, 42, 0.96);
      color: var(--text);
      font-size: 11px;
    }

    .comment-form textarea {
      resize: vertical;
      min-height: 40px;
      padding: 4px 6px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.96);
      color: var(--text);
      font-size: 12px;
    }

    .comment-form button {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 999px;
      border: none;
      background: radial-gradient(circle at 0 0, #38bdf8, #4f46e5);
      color: #ecfeff;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.85);
    }

    .table-wrapper {
      background:
        radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.15), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(79, 70, 229, 0.3), transparent 55%),
        #020617;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(55, 65, 81, 0.9);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.95);
      padding: 8px 0 4px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      background: radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.4), rgba(15, 23, 42, 1));
    }

    th, td {
      padding: 7px 10px;
      text-align: center;
      border-bottom: 1px solid rgba(30, 64, 175, 0.9);
    }

    th:first-child, td:first-child {
      text-align: right;
    }

    th {
      font-weight: 600;
      color: #c7d2fe;
    }

    tbody tr:nth-child(even) {
      background: rgba(15, 23, 42, 0.96);
    }

    tbody tr:nth-child(odd) {
      background: rgba(15, 23, 42, 0.9);
    }

    .pos-pill {
      min-width: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 0;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .pos-top {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(59, 130, 246, 0.9));
      color: #e0f2fe;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
    }

    .pos-mid {
      background: rgba(79, 70, 229, 0.35);
      color: #c7d2fe;
    }

    .pos-bottom {
      background: rgba(248, 113, 113, 0.25);
      color: #fecaca;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-name-sm {
      font-size: 12px;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .team-card {
      background:
        radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.15), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(129, 140, 248, 0.2), transparent 55%),
        #020617;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(75, 85, 99, 0.9);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.95);
    }

    .team-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-soft);
      border: 1px solid rgba(129, 140, 248, 0.7);
    }

    .tip-box {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-soft);
      border-radius: 14px;
      border: 1px dashed rgba(148, 163, 184, 0.6);
      padding: 8px 10px;
      background: radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.12), rgba(15, 23, 42, 0.95));
    }

    .tip-box code {
      background: rgba(15, 23, 42, 0.96);
      padding: 2px 4px;
      border-radius: 6px;
      direction: ltr;
      display: inline-block;
      font-size: 10px;
    }

    /* اسپلش موشن‌گرافیک */
    #splash-screen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 10% 0, rgba(56, 189, 248, 0.25), transparent 55%),
        radial-gradient(circle at 90% 0, rgba(129, 140, 248, 0.32), transparent 55%),
        #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #splash-screen video {
      max-width: 80vw;
      max-height: 80vh;
      border-radius: 18px;
      box-shadow: 0 0 45px rgba(56, 189, 248, 0.9);
      border: 1px solid rgba(129, 140, 248, 0.8);
    }

    #splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 680px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-right {
        align-items: flex-start;
      }
      .match-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .team-away {
        justify-content: flex-start;
      }
      .match-center {
        justify-self: flex-start;
        text-align: right;
      }
      .match-meta {
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
      }
      #splash-screen video {
        max-width: 90vw;
        max-height: 60vh;
      }
    }
  </style>
</head>
<body>

  <!-- اسپلش اسکرین موشن‌گرافیک (۲ ثانیه اول) -->
  <div id="splash-screen">
    <video src="intro.mp4" autoplay muted playsinline></video>
  </div>

  <div class="app">
    <!-- آهنگ پس‌زمینه: فایل music.mp3 را کنار index.html قرار بده -->
    <audio id="bg-audio" src="music.mp3" loop></audio>

    <header>
      <div class="brand">
        <div class="brand-logo">
          <img src="logo.png" alt="لوگوی لیگ فوتسال روستای چاشم" class="brand-logo-img" />
        </div>
        <div>
          <div class="brand-text-title">کالیگا</div>
          <div class="brand-text-sub">لیگ فوتسال روستای چاشم</div>
        </div>
      </div>
      <div class="header-right">
        <div>فصل ۱۴۰۴ / ۲۰۲۵</div>
        <div>به‌روزرسانی نمونه دیتا برای تست</div>
        <div class="live-pill">نمایش دمو • آنلاین</div>
        <button id="audio-toggle" class="audio-toggle">🔈 موسیقی خاموش</button>
      </div>
    </header>

    <nav>
      <button class="tab-btn active" data-page="fixtures">
        <span class="nav-icon">📅</span>
        <span class="nav-label">برنامه بازی‌ها</span>
      </button>
      <button class="tab-btn" data-page="results">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">نتایج</span>
      </button>
      <button class="tab-btn" data-page="table">
        <span class="nav-icon">📊</span>
        <span class="nav-label">جدول لیگ</span>
      </button>
      <button class="tab-btn" data-page="teams">
        <span class="nav-icon">👥</span>
        <span class="nav-label">تیم‌ها</span>
      </button>
    </nav>

    <main id="page-content">
      <!-- محتوا با جاوااسکریپت تزریق می‌شود -->
    </main>


  </div>

  <script>
    const { createClient } = supabase;

    const SUPABASE_URL = "https://lznrwbrxzgnczfqgamxp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6bnJ3YnJ4emduY3pmcWdhbXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjU5MTQsImV4cCI6MjA3OTUwMTkxNH0.lHjgbKJ90Mws5z5-jzJYqAoyRgjfMGikmJTuAi1Nxqk";

    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const teams = [

      { id: 2,  name: "استودیو نامبر وان",            shortName: "NUO",  color: "#22c55e", logo: "🎬" },
      { id: 3,  name: "زنده یاد سید مهدی نبوی",       shortName: "SMN",  color: "#f97316", logo: "✨" },
      { id: 4,  name: "زنده یاد مجید جعفری",          shortName: "MJA",  color: "#a855f7", logo: "🌟" },
      { id: 5,  name: "زنده یاد بهمن و مصطفی جعفری",  shortName: "BMJ",  color: "#eab308", logo: "💎" },

        return map[ch] || ch;

    }

    async function getPredictionStats(matchId) {
      try {
        const { data, error } = await db
          .from("predictions")
          .select("home_score, away_score")
          .eq("match_id", matchId);

        if (error) {
          console.error("خطا در خواندن پیش‌بینی‌ها:", error);
          return null;
        }

        if (!data || data.length === 0) return null;

        let home = 0, draw = 0, away = 0;
        data.forEach(r => {
          if (r.home_score > r.away_score) home++;
          else if (r.home_score < r.away_score) away++;
          else draw++;
        });

        const total = home + draw + away;
        if (!total) return null;

        return {
          total,
          homePercent: Math.round(home * 100 / total),
          drawPercent: Math.round(draw * 100 / total),
          awayPercent: Math.round(away * 100 / total)
        };
      } catch (e) {
        console.error(e);
        return null;
      }
    }

    function calculateTable() {
      const stats = new Map();
      teams.forEach(team => {
        stats.set(team.id, {
          teamId: team.id,
          played: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          goalsFor: 0,
          goalsAgainst: 0,
          points: 0
        });
      });

      matches.filter(m => m.status === "finished").forEach(match => {
        const homeStat = stats.get(match.homeTeamId);
        const awayStat = stats.get(match.awayTeamId);

        homeStat.played++;
        awayStat.played++;

        homeStat.goalsFor += match.homeScore;
        homeStat.goalsAgainst += match.awayScore;

        awayStat.goalsFor += match.awayScore;
        awayStat.goalsAgainst += match.homeScore;

        if (match.homeScore > match.awayScore) {
          homeStat.wins++;
          awayStat.losses++;
          homeStat.points += 3;
        } else if (match.homeScore < match.awayScore) {
          awayStat.wins++;
          homeStat.losses++;
          awayStat.points += 3;
        } else {
          homeStat.draws++;
          awayStat.draws++;
          homeStat.points++;
          awayStat.points++;
        }
      });

      const tableArray = Array.from(stats.values());
      tableArray.sort((a, b) => {
        const gdA = a.goalsFor - a.goalsAgainst;
        const gdB = b.goalsFor - b.goalsAgainst;
        if (b.points !== a.points) return b.points - a.points;
        if (gdB !== gdA) return gdB - gdA;
        if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
        const teamA = getTeamById(a.teamId).name;
        const teamB = getTeamById(b.teamId).name;
        return teamA.localeCompare(teamB, "fa");
      });

      return tableArray;
    }

    async function handlePrediction(matchId) {
      const match = matches.find(m => m.id === matchId);
      if (!match) return;

      const home = getTeamById(match.homeTeamId);
      const away = getTeamById(match.awayTeamId);

      let hs = prompt(`گل‌های ${home.name} را برای پیش‌بینی وارد کن:`, "0");
      if (hs === null) return;
      let as = prompt(`گل‌های ${away.name} را برای پیش‌بینی وارد کن:`, "0");
      if (as === null) return;

      hs = parseInt(hs, 10);
      as = parseInt(as, 10);

      if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0) {
        alert("لطفاً فقط عدد صحیح مثبت وارد کن.");
        return;
      }

      await savePredictionToDB(matchId, hs, as);
      alert("پیش‌بینی شما ذخیره شد.");

      setActivePage("fixtures");
    }

          } else {
            audioToggle.textContent = "🔊 موسیقی روشن";
            audioToggle.classList.add("active");
          }
        }

        updateAudioButton();

        audioToggle.addEventListener("click", () => {
          if (audio.paused) {
            audio.play().catch(() => {});
          } else {
            audio.pause();
          }
          updateAudioButton();
        });
      }
    });
  </script>
</body>
</html>
