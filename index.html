  <!-- فونت فارسی Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a1126;
      --bg-soft: #191c28;
      --card: #2c3040;
      --accent: #18a34a;
      --accent-soft: rgba(24, 163, 74, 0.2);
      --text: #f9fafb;
      --text-soft: #a1a5b5;
      --danger: #ef4444;
      --border: #262c46;
      --radius-lg: 18px;
      --radius-full: 999px;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      font-family: "Vazirmatn", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, var(--bg-soft), var(--bg) 55%);
      color: var(--text);
      overflow-x: hidden; /* جلوگیری از اسکرول افقی در موبایل */
    }

    /* لایه موشن‌گرافی ورود */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #020617, #000000);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .intro-frame {
      padding: 10px;
      border-radius: 26px;
      background: radial-gradient(circle at top, #1f2937, #020617 70%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.6);
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-video {
      max-width: 100%;
      max-height: 100%;
      display: block;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(15, 23, 42, 0.9);
    }

    .intro-skip {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.9);
      color: #f9fafb;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
      direction: ltr;
      border: 1px solid rgba(148, 163, 184, 0.7);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .app {
      max-width: 1100px;
      margin: 24px auto 40px;
      padding: 0 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 65px;
      height: 65px;
      border-radius: 20px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      padding: 0;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-text-title {
      font-size: 22px;
      font-weight: 700;
    }

    .brand-text-sub {
      font-size: 13px;
      color: var(--text-soft);
    }

    .header-right {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      font-size: 12px;
      color: var(--text-soft);
    }

    /* تاریخ و ساعت زنده */
    .current-datetime {
      font-size: 11px;
      color: var(--text-soft);
    }

    .live-pill {
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 11px;
    }

    .audio-toggle,
    .mode-toggle {
      margin-top: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .audio-toggle.active,
    .mode-toggle.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(34, 197, 94, 0.8);
    }

    nav {
      display: flex;
      gap: 8px;
      padding: 4px;
      background: rgba(9, 12, 24, 0.85);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(56, 63, 99, 0.8);
      box-shadow: var(--shadow-soft);
      margin-bottom: 18px;
      backdrop-filter: blur(14px);
    }

    nav button {
      flex: 1;
      border-radius: 999px;
      border: none;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      transition: 0.18s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    nav button .nav-icon {
      font-size: 16px;
    }

    nav button .nav-label {
      white-space: nowrap;
    }

    nav button.active {
      background: linear-gradient(135deg, var(--accent), #22c55e);
      color: #ecfdf3;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.55);
    }

    nav button.active .nav-icon {
      filter: drop-shadow(0 0 6px rgba(22, 163, 74, 0.8));
    }

    nav button:hover:not(.active) {
      background: rgba(37, 44, 79, 0.75);
      color: var(--text);
    }

    main {
      margin-top: 14px;
    }

    .section-title {
      font-size: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span.dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
    }

    .card {
      background: radial-gradient(circle at top left, var(--card), var(--bg-soft) 55%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .match-row {
      display: grid;
      grid-template-columns: 1.2fr auto 1.2fr;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .team-side {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-home {
      justify-content: flex-start;
    }

    .team-away {
      justify-content: flex-end;
    }

    .match-meta {
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }

    .team-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-name {
      font-weight: 500;
    }

    .team-logo {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #f9fafb;
      border: 1px solid rgba(15, 23, 42, 0.6);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.5);
      overflow: hidden;
    }

    .team-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .team-logo-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* وقتی لوگو واقعاً لود می‌شود */
    .team-logo-has-img {
      background: transparent !important;
    }

    .team-logo-clickable {
      cursor: zoom-in;
    }

    .match-center {
      text-align: center;
    }

    .match-score {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .match-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-top: 2px;
    }

    .status-finished {
      background: rgba(37, 99, 235, 0.12);
      color: #60a5fa;
    }

    .status-live {
      background: rgba(248, 113, 113, 0.1);
      color: #f87171;
    }

    .status-upcoming {
      background: rgba(148, 163, 184, 0.12);
      color: #e5e7eb;
    }

    /* تب‌های هفته‌ها */
    .week-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .week-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
    }

    .week-btn.active {
      background: var(--accent);
      color: #ecfdf3;
      border-color: transparent;
    }

    /* پیش‌بینی‌ها */
    .prediction-summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-soft);
    }

    .prediction-bars {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .prediction-bar {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      height: 16px;
    }

    .prediction-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      border-radius: 999px;
    }

    .prediction-fill-home {
      background: rgba(34, 197, 94, 0.5);
    }

    .prediction-fill-draw {
      background: rgba(148, 163, 184, 0.6);
    }

    .prediction-fill-away {
      background: rgba(59, 130, 246, 0.5);
    }

    .prediction-label {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 10px;
      line-height: 16px;
    }
          .prediction-donut-wrapper {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .prediction-donut {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.7);
      /* 🎬 انیمیشن لود شدن */
      animation: prediction-pop 0.6s ease-out;
    }

    .prediction-donut-inner {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: var(--bg-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      text-align: center;
      color: var(--pred-text);
      /* انیمیشن محو شدن نرم متن وسط */
      animation: prediction-inner-fade 0.6s ease-out 0.1s both;
    }

    .prediction-donut-label {
      opacity: 0.8;
    }

    .prediction-donut-value {
      font-weight: 700;
      font-size: 13px;
      margin-top: 2px;
      line-height: 1.4;
    }

    /* هایلایت قوی‌ترین پیش‌بینی */
    .prediction-donut.max-home::before,
    .prediction-donut.max-draw::before,
    .prediction-donut.max-away::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      pointer-events: none;
    }

    .prediction-donut.max-home::before {
      border: 2px solid var(--pred-home);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
    }

    .prediction-donut.max-draw::before {
      border: 2px solid var(--pred-draw);
      box-shadow: 0 0 12px rgba(148, 163, 184, 0.7);
    }

    .prediction-donut.max-away::before {
      border: 2px solid var(--pred-away);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.7);
    }

    .prediction-legend {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--pred-text);
    }

    .prediction-legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .prediction-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .prediction-legend-dot-home {
      background: var(--pred-home);
    }

    .prediction-legend-dot-draw {
      background: var(--pred-draw);
    }

    .prediction-legend-dot-away {
      background: var(--pred-away);
    }

    /* 🎥 keyframes انیمیشن‌ها */
    @keyframes prediction-pop {
      0% {
        transform: scale(0.4) rotate(-10deg);
        opacity: 0;
      }
      60% {
        transform: scale(1.05) rotate(2deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes prediction-inner-fade {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }


    /* اکشن‌ها و کامنت‌ها */
    .match-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .action-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-soft);
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(30, 64, 175, 0.7);
      color: #e5e7eb;
    }

    .comments-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.4);
    }

    .comments-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 6px;
    }

    .comment-item {
      margin-bottom: 6px;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.85);
    }

    .comment-header {
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: 2px;
    }

    .comment-body {
      font-size: 12px;
    }

    .comment-empty {
      font-size: 11px;
      color: var(--text-soft);
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .comment-username {
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
    }

    .comment-username input {
      flex: 1;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 11px;
    }

    .comment-form textarea {
      resize: vertical;
      min-height: 40px;
      padding: 4px 6px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 12px;
    }

    .comment-form button {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ecfdf3;
      font-size: 11px;
      cursor: pointer;
    }

    .table-wrapper {
      background: radial-gradient(circle at top left, var(--card), var(--bg-soft) 58%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 8px 0 4px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      background: rgba(15, 23, 42, 0.95);
      color: var(--text);
    }

    th, td {
      padding: 7px 10px;
      text-align: center;
      border-bottom: 1px solid rgba(31, 41, 55, 0.9);
    }

    th:first-child, td:first-child {
      text-align: right;
    }

    th {
      font-weight: 600;
      color: var(--text-soft);
    }

    tbody tr:nth-child(even) {
      background: rgba(15, 23, 42, 0.7);
    }

    tbody tr:nth-child(odd) {
      background: rgba(15, 23, 42, 0.4);
    }

    .pos-pill {
      min-width: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 0;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .pos-top {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
    }

    .pos-mid {
      background: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
    }

    .pos-bottom {
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-name-sm {
      font-size: 12px;
    }

    /* گرید تیم‌ها: ۴ ردیف ۳تایی */
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .team-card {
      background: radial-gradient(circle at top, var(--card), var(--bg-soft) 58%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .team-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      color: var(--text-soft);
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.5);
      transition: 0.2s ease;
    }

    .badge:hover {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .tip-box {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-soft);
      border-radius: 14px;
      border: 1px dashed rgba(148, 163, 184, 0.6);
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.7);
    }

    .tip-box code {
      background: rgba(15, 23, 42, 0.9);
      padding: 2px 4px;
      border-radius: 6px;
      direction: ltr;
      display: inline-block;
      font-size: 10px;
    }

    .footer-credit {
      margin-top: 10px;
      font-size: 10px;
      color: rgba(148, 163, 184, 0.8);
      text-align: left;
      direction: ltr;
      line-height: 1.6;
    }

    .footer-credit a {
      color: rgba(148, 163, 184, 0.95);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-credit a:hover {
      text-decoration: underline;
    }

    /* پنجره نمایش عکس تیم‌ها / لوگوها */
    .team-image-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;

    function getTeamById(id) {

    function formatDate(dateStr) {
      const [y, m, d] = dateStr.split("-");
      return `${d} / ${m}`;

    function getStatusLabel(status) {
      switch (status) {
        case "finished": return "پایان یافته";
        case "live":     return "زنده";
        case "upcoming":

      }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/[&<>"']/g, ch => {
        const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };
        return map[ch] || ch;
      });
    }

    // تاریخ و ساعت زنده (شمسی + ساعت سیستم)
    function updateCurrentDateTime() {
      const el = document.getElementById("current-datetime");
      if (!el) return;

      const now = new Date();

      const dateFormatter = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
        weekday: "short",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });

      const timeFormatter = new Intl.DateTimeFormat("fa-IR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      el.textContent = dateFormatter.format(now) + " • " + timeFormatter.format(now);
    }

      const fontAdj = s < 30 ? "font-size:15px;" : "";
      const clickableClass = clickable ? " team-logo-clickable" : "";
      const clickAttr = clickable ? `onclick="showTeamLogo(${team.id})"` : "";
      return `
        <div class="team-logo${clickableClass}" ${clickAttr}
             style="background:${bg};width:${s}px;height:${s}px;${fontAdj}">

      `;

    function handleTeamLogoError(img, teamId) {
      const triedJpg = img.getAttribute("data-tried-jpg");
      if (!triedJpg) {
        img.setAttribute("data-tried-jpg", "1");
        img.src = `team${teamId}.jpg`;
      } else {
        img.style.display = "none";
        const fallback = img.previousElementSibling;
        if (fallback) {
          fallback.style.display = "flex";
        }
      }
    }

    function handleTeamLogoLoad(img) {
      const wrapper = img.parentElement;
      if (!wrapper) return;
      wrapper.classList.add("team-logo-has-img");

      // کمی بزرگ‌تر کردن قاب لوگو (حدود ۱۵٪)
      const w = parseInt(wrapper.style.width, 10);
      const h = parseInt(wrapper.style.height, 10);
      if (!isNaN(w)) wrapper.style.width = Math.round(w * 1.15) + "px";

    async function savePredictionToDB(matchId, homeScore, awayScore) {
      try {
        const username = getSavedUsername() || null;

        const { error } = await db
          .from("predictions")
          .insert({
            match_id: matchId,
            username,
            home_score: homeScore,
            away_score: awayScore
          });

        if (error) {

      } catch (e) {
        console.error(e);
        alert("مشکل در ارتباط با سرور پیش‌بینی.");
      }
    }

    async function getPredictionStats(matchId) {
      try {
        const { data, error } = await db
          .from("predictions")
          .select("home_score, away_score")
          .eq("match_id", matchId);

        if (error) {
          console.error("خطا در خواندن پیش‌بینی‌ها:", error);
          return null;
        }

        if (!data || data.length === 0) return null;

        let home = 0, draw = 0, away = 0;
        data.forEach(r => {
          if (r.home_score > r.away_score) home++;
          else if (r.home_score < r.away_score) away++;
          else draw++;
        });

        const total = home + draw + away;
        if (!total) return null;

        return {
          total,
          homePercent: Math.round(home * 100 / total),
          drawPercent: Math.round(draw * 100 / total),
          awayPercent: Math.round(away * 100 / total)
        };
      } catch (e) {
        console.error(e);
        return null;
      }
    }

        return data || [];
      } catch (e) {

      }
    }

    // -----------------------------
    // ۵) صفحه برنامه بازی‌ها
    // -----------------------------
    async function renderFixturesPage() {
      const container = document.getElementById("page-content");

      let weeksHtml = "";
      for (let w = 1; w <= 11; w++) {
        weeksHtml += `
          <button class="week-btn ${w === currentWeek ? "active" : ""}" data-week="${w}">
            هفته ${w}
          </button>
        `;
      }

      let html = `
        <div class="section-title">
          <span class="dot"></span>
          <span>برنامه بازی‌ها • هفته ${currentWeek}</span>
        </div>
        <div class="week-tabs">
          ${weeksHtml}
        </div>
      `;

      const matchesOfWeek = matches.filter(m => m.week === currentWeek);

      if (!matchesOfWeek.length) {
        html += `<div class="card">برای این هفته هنوز بازی ثبت نشده است.</div>`;
      } else {
        for (const match of matchesOfWeek) {
          const home = getTeamById(match.homeTeamId);
          const away = getTeamById(match.awayTeamId);

          let stats = null;
          if (match.status === "upcoming" || match.status === "live") {
            stats = await getPredictionStats(match.id);
          }

          html += `
            <div class="card">
              <div class="match-row">
                <div class="team-side team-home">
                  ${getTeamLogoHtml(home)}
                  <div class="team-name">${home.name}</div>
                </div>
                <div class="match-center">
          `;

          if (match.status === "upcoming") {
            html += `
                  <div class="match-score">- : -</div>
                  <div class="match-status ${getStatusClass(match.status)}">
                    ${getStatusLabel(match.status)}
                  </div>
            `;
          } else {
            html += `
                  <div class="match-score">${match.homeScore} : ${match.awayScore}</div>
                  <div class="match-status ${getStatusClass(match.status)}">
                    ${getStatusLabel(match.status)}
                  </div>
            `;
          }

          html += `
                </div>
                <div class="team-side team-away">
                  <div class="team-name">${away.name}</div>
                  ${getTeamLogoHtml(away)}
                </div>
              </div>
              <div class="match-meta">
                <span>هفته ${match.week} • ${match.stadium}</span>
                <span>تاریخ: ${formatDate(match.date)} • ${match.time}</span>
              </div>
          `;

            if (stats) {
            const homeP = stats.homePercent;
            const drawP = stats.drawPercent;
            const awayP = stats.awayPercent;

            // تبدیل درصد به زاویه
            const homeAngle = homeP * 3.6;
            const drawAngle = drawP * 3.6;
            const awayAngle = 360 - homeAngle - drawAngle;

            // عنوان‌ها: اسم تیم‌ها به‌جای میزبان/مهمان
            const homeTitle = home.name;
            const drawTitle = "مساوی";
            const awayTitle = away.name;

            // پیدا کردن قوی‌ترین پیش‌بینی
            let maxTitle = home.shortName;
            let maxValue = homeP;
            let maxClass = "max-home";

            if (drawP > maxValue) {
              maxValue = drawP;
              maxTitle = drawTitle;
              maxClass = "max-draw";
            }
            if (awayP > maxValue) {
              maxValue = awayP;
              maxTitle = away.shortName;
              maxClass = "max-away";
            }

            const donutStyle = `
              background: conic-gradient(
                var(--pred-home) 0deg ${homeAngle}deg,
                var(--pred-draw) ${homeAngle}deg ${homeAngle + drawAngle}deg,
                var(--pred-away) ${homeAngle + drawAngle}deg 360deg
              );
            `;

            html += `
              <div class="prediction-summary">
                <div>پیش‌بینی کاربران (تعداد ${stats.total}):</div>
                <div class="prediction-donut-wrapper">
                  <div class="prediction-donut ${maxClass}" style="${donutStyle}">
                    <div class="prediction-donut-inner">
                      <div class="prediction-donut-label">بیشترین</div>
                      <div class="prediction-donut-value">
                        ${maxTitle}<br>${maxValue}%
                      </div>
                    </div>
                  </div>
                  <div class="prediction-legend">
                    <div class="prediction-legend-item">
                      <span class="prediction-legend-dot prediction-legend-dot-home"></span>
                      <span>${homeTitle} ${homeP}%</span>
                    </div>
                    <div class="prediction-legend-item">
                      <span class="prediction-legend-dot prediction-legend-dot-draw"></span>
                      <span>${drawTitle} ${drawP}%</span>
                    </div>
                    <div class="prediction-legend-item">
                      <span class="prediction-legend-dot prediction-legend-dot-away"></span>
                      <span>${awayTitle} ${awayP}%</span>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }



          if (match.status === "upcoming" || match.status === "live") {
            html += `
              <div class="match-actions">
                <button class="action-btn" onclick="handlePrediction(${match.id})">📊 ثبت پیش‌بینی</button>
              </div>
            `;
          } else if (match.status === "finished") {
            html += `
              <div class="match-actions">
                <button class="action-btn" onclick="showMatchDetails(${match.id})">📋 جزئیات بازی</button>
              </div>
            `;
          }

          html += `</div>`;
        }
      }

      container.innerHTML = html;

      const weekButtons = container.querySelectorAll(".week-btn");
      weekButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          const w = parseInt(btn.dataset.week, 10);
          if (!isNaN(w)) {
            currentWeek = w;
            renderFixturesPage();
          }
        });
      });
    }

    // -----------------------------

function renderResultsPage() {
  const container = document.getElementById("page-content");

  const finished = matches
    .filter(m => m.status === "finished")
    .slice() // کپی برای اینکه آرایه اصلی دست‌نخورَد
    // 2) سورت نزولی: اول تاریخ (جدیدتر بالاتر)، بعد ساعت
    .sort((a, b) => {
      // تاریخ‌ها به صورت "YYYY-MM-DD" ذخیره شده‌اند (شمسی اما فرمتش عددی است)
      if (a.date !== b.date) return b.date.localeCompare(a.date);
      // اگر تاریخ برابر بود، ساعت را مقایسه کن (فرمت "HH:MM")
      return (b.time || "").localeCompare(a.time || "");
    });

    // -----------------------------
    // ۷) جدول لیگ
    // -----------------------------
    function calculateTable() {
      const stats = new Map();
      teams.forEach(team => {
        stats.set(team.id, {
          teamId: team.id,
          played: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          goalsFor: 0,
          goalsAgainst: 0,
          points: 0
        });
      });

      matches.filter(m => m.status === "finished").forEach(match => {
        const homeStat = stats.get(match.homeTeamId);
        const awayStat = stats.get(match.awayTeamId);

        homeStat.played++;
        awayStat.played++;

        homeStat.goalsFor += match.homeScore;
        homeStat.goalsAgainst += match.awayScore;

        awayStat.goalsFor += match.awayScore;
        awayStat.goalsAgainst += match.homeScore;

        if (match.homeScore > match.awayScore) {
          homeStat.wins++;
          awayStat.losses++;
          homeStat.points += 3;
        } else if (match.homeScore < match.awayScore) {
          awayStat.wins++;
          homeStat.losses++;
          awayStat.points += 3;
        } else {
          homeStat.draws++;
          awayStat.draws++;
          homeStat.points++;
          awayStat.points++;
        }
      });

      const tableArray = Array.from(stats.values());
      tableArray.sort((a, b) => {
        const gdA = a.goalsFor - a.goalsAgainst;
        const gdB = b.goalsFor - b.goalsAgainst;
        if (b.points !== a.points) return b.points - a.points;
        if (gdB !== gdA) return gdB - gdA;
        if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
        const teamA = getTeamById(a.teamId).name;
        const teamB = getTeamById(b.teamId).name;
        return teamA.localeCompare(teamB, "fa");
      });

      return tableArray;
    }

    function getPosClass(pos) {
      if (pos <= 4) return "pos-top";
      if (pos >= 10) return "pos-bottom";
      return "pos-mid";
    }

    function renderTablePage() {
      const container = document.getElementById("page-content");
      const tableData = calculateTable();

      let html = `
        <div class="section-title">

      tableData.forEach((row, index) => {

        html += `

        accentSoft: "rgba(34, 197, 94, 0.28)",
        text: "#14532d",
        textSoft: "#166534",
        border: "rgba(34, 197, 94, 0.7)"
      },
      {
        name: "light-blue",
        bg: "#dbeafe",
        bgSoft: "#bfdbfe",
        card: "#ffffff",
        accent: "#3b82f6",
        accentSoft: "rgba(59, 130, 246, 0.30)",
        text: "#1e3a8a",
        textSoft: "#1e40af",
        border: "rgba(59, 130, 246, 0.7)"
      },
      {
        name: "cream",
        bg: "#fff7ed",
        bgSoft: "#fed7aa",
        card: "#ffffff",
        accent: "#ea580c",
        accentSoft: "rgba(234, 88, 12, 0.25)",
        text: "#7c2d12",
        textSoft: "#9a3412",
        border: "rgba(248, 153, 56, 0.7)"
      },
      {
        name: "white",
        bg: "#f9fafb",
        bgSoft: "#e5e7eb",
        card: "#ffffff",
        accent: "#64748b",
        accentSoft: "rgba(100, 116, 139, 0.25)",
        text: "#0f172a",
        textSoft: "#475569",
        border: "rgba(148, 163, 184, 0.8)"
      }
    ];

    let currentMode = "dark";
    let currentThemeIndex = 0;

    function getCurrentThemeList() {
      return currentMode === "dark" ? darkThemes : lightThemes;
    }

    function applyTheme(theme) {
      const root = document.documentElement;
      root.style.setProperty("--bg", theme.bg);
      root.style.setProperty("--bg-soft", theme.bgSoft);
      root.style.setProperty("--card", theme.card);
      root.style.setProperty("--accent", theme.accent);
      root.style.setProperty("--accent-soft", theme.accentSoft);
      root.style.setProperty("--text", theme.text || "#f9fafb");
      root.style.setProperty("--text-soft", theme.textSoft || "#a1a5b5");
      root.style.setProperty("--border", theme.border);

      document.body.style.background =
        `radial-gradient(circle at top, ${theme.bgSoft}, ${theme.bg} 55%)`;
    
      // 🎯 رنگ‌های نمودار پیش‌بینی (برای تم تیره / روشن)
    if (currentMode === "dark") {
      root.style.setProperty("--pred-home", "#22c55e");   // سبز برد میزبان
      root.style.setProperty("--pred-draw", "#e5e7eb");   // طوسی مساوی
      root.style.setProperty("--pred-away", "#3b82f6");   // آبی برد مهمان
      root.style.setProperty("--pred-text", "#f9fafb");   // متن داخل دونات/راهنما
      }
    else {
      root.style.setProperty("--pred-home", "#16a34a");   // سبز تیره‌تر
      root.style.setProperty("--pred-draw", "#6b7280");   // طوسی پررنگ
      root.style.setProperty("--pred-away", "#2563eb");   // آبی مناسب پس‌زمینه روشن
      root.style.setProperty("--pred-text", "#111827");
      }
    }
    function initTheme() {
      const list = getCurrentThemeList();
      if (!list.length) return;
      applyTheme(list[currentThemeIndex]);
    }

    function rotateTheme() {
      const list = getCurrentThemeList();
      if (!list.length) return;
      currentThemeIndex = (currentThemeIndex + 1) % list.length;
      applyTheme(list[currentThemeIndex]);
    }

    function setMode(mode) {
      currentMode = mode;
      currentThemeIndex = 0;
      initTheme();
      const modeToggle = document.getElementById("mode-toggle");
      if (modeToggle) {
        if (currentMode === "dark") {
          modeToggle.textContent = "🌙 حالت تیره";
        } else {
          modeToggle.textContent = "☀️ حالت روشن";
        }
      }
    }

    // -----------------------------
    // ۱۳) مدیریت تب‌ها
    // -----------------------------
    function setActivePage(page) {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
      });

      if (page === "fixtures") renderFixturesPage();
      else if (page === "results") renderResultsPage();
      else if (page === "table") renderTablePage();
      else if (page === "teams") renderTeamsPage();
      else if (page === "media") renderMediaPage();
      else if (page === "stats") renderStatsPage();
      else if (page === "feedback") renderFeedbackPage();
    }

    // -----------------------------
    // ۱۴) نمایش/مخفی کردن عکس تیم و لوگو
    // -----------------------------
    function showTeamImage(teamId) {
      const overlay = document.getElementById("team-image-overlay");
      const img = document.getElementById("team-image-img");
      const dialog = document.querySelector(".team-image-dialog");
      if (!overlay || !img || !dialog) return;

      overlay.style.display = "flex";
      dialog.style.background = "#000";
      img.style.display = "block";

      let triedPng = false;
      img.onerror = () => {
        if (!triedPng) {
          triedPng = true;
          img.src = `pic${teamId}.png`;
        } else {
          img.style.display = "none";
          dialog.style.background = "#000";
        }
      };

      img.src = `pic${teamId}.jpg`;
    }

    function showTeamLogo(teamId) {
      const overlay = document.getElementById("team-image-overlay");
      const img = document.getElementById("team-image-img");
      const dialog = document.querySelector(".team-image-dialog");
      if (!overlay || !img || !dialog) return;

      overlay.style.display = "flex";
      dialog.style.background = "#000";
      img.style.display = "block";

      let triedJpg = false;
      img.onerror = () => {
        if (!triedJpg) {
          triedJpg = true;
          img.src = `team${teamId}.jpg`;
        } else {
          // اگر لوگو هم نبود، دیالوگ را ببند
          overlay.style.display = "none";
        }
      };

      img.src = `team${teamId}.png`;
    }

    function showGalleryImage(imageSrc) {
      const overlay = document.getElementById("team-image-overlay");
      const img = document.getElementById("team-image-img");
      const dialog = document.querySelector(".team-image-dialog");
      if (!overlay || !img || !dialog) return;

      overlay.style.display = "flex";
      dialog.style.background = "#000";
      img.style.display = "block";

      // برای گالری دیگه لازم نیست onerror عوض کنیم
      img.onerror = null;
      img.src = imageSrc;
    }
    
    function hideTeamImage() {
      const overlay = document.getElementById("team-image-overlay");
      if (overlay) overlay.style.display = "none";
    }

    // -----------------------------
    // ۱۵) جزئیات بازی
    // -----------------------------
    function showMatchDetails(matchId) {
      const overlay = document.getElementById("match-details-overlay");
      const content = document.getElementById("match-details-content");
      if (!overlay || !content) return;

      const match = matches.find(m => m.id === matchId);
      if (!match) return;

      const home = getTeamById(match.homeTeamId);
      const away = getTeamById(match.awayTeamId);

      const d = matchDetails[matchId] || {
        homeScorers: [`گلزن‌های تیم ${home.name}: ...`],
        awayScorers: [`گلزن‌های تیم ${away.name}: ...`],
        yellowCards: ["کارت زرد: ..."],
        redCards: ["کارت قرمز: ..."]
      };

      let html = `
        <div class="match-details-title">
          جزئیات بازی: ${escapeHtml(home.name)} ${match.homeScore} - ${match.awayScore} ${escapeHtml(away.name)}
        </div>
        <div style="font-size:11px;color:var(--text-soft);margin-bottom:6px;">
          هفته ${match.week} • ${escapeHtml(match.stadium)} • ${formatDate(match.date)} • ${match.time}
        </div>

        <div class="match-details-section-title">گلزن‌های ${escapeHtml(home.name)}</div>
        <ul class="match-details-list">
      `;

      (d.homeScorers || []).forEach(item => {
        html += `<li>${escapeHtml(item)}</li>`;
      });

      html += `
        </ul>

        <div class="match-details-section-title">گلزن‌های ${escapeHtml(away.name)}</div>
        <ul class="match-details-list">
      `;

      (d.awayScorers || []).forEach(item => {
        html += `<li>${escapeHtml(item)}</li>`;
      });

      html += `
        </ul>

        <div class="match-details-section-title">کارت‌های زرد</div>
        <ul class="match-details-list">
      `;

      (d.yellowCards || []).forEach(item => {
        html += `<li>${escapeHtml(item)}</li>`;
      });

      html += `
        </ul>

        <div class="match-details-section-title">کارت‌های قرمز</div>
        <ul class="match-details-list">
      `;

      (d.redCards || []).forEach(item => {
        html += `<li>${escapeHtml(item)}</li>`;
      });

      html += `</ul>`;

      content.innerHTML = html;
      overlay.style.display = "flex";
    }

    function closeMatchDetails() {
      const overlay = document.getElementById("match-details-overlay");
      if (overlay) overlay.style.display = "none";
    }

    // -----------------------------
    // ۱۶) منوی کناری
    // -----------------------------
    function openSideMenu() {
      const menu = document.getElementById("side-menu");
      const backdrop = document.getElementById("side-menu-backdrop");
      if (menu && backdrop) {
        menu.classList.add("open");
        backdrop.style.display = "block";
      }
    }

    function closeSideMenu() {
      const menu = document.getElementById("side-menu");
      const backdrop = document.getElementById("side-menu-backdrop");
      if (menu && backdrop) {
        menu.classList.remove("open");
        backdrop.style.display = "none";
      }
    }

    function navigateMenu(where) {
      if (where === "home") setActivePage("fixtures");
      else if (where === "media") setActivePage("media");
      else if (where === "stats") setActivePage("stats");
      else if (where === "feedback") setActivePage("feedback");
      closeSideMenu();
    }

    // -----------------------------
    // ۱۷) موشن‌گرافی
    // -----------------------------
    function hideIntro() {
      const overlay = document.getElementById("intro-overlay");
      const video = document.getElementById("intro-video");
      if (video) {
        video.pause();
      }
      if (overlay) {
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
        }, 300);
      }
    }

    // -----------------------------
    // ۱۸) ثبت بازدید
    // -----------------------------
    async function incrementPageView() {
      try {
        await db.from("page_views").insert({});
      } catch (e) {
        console.error("خطا در ثبت بازدید:", e);
      }
    }

    // -----------------------------
    // ۱۹) شروع کار
    // -----------------------------
    document.addEventListener("DOMContentLoaded", () => {
      setMode("dark");

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          setActivePage(btn.dataset.page);
          rotateTheme();
        });
      });
      setActivePage("results");

      // تاریخ و ساعت زنده
      updateCurrentDateTime();
      setInterval(updateCurrentDateTime, 1000);

      const modeToggle = document.getElementById("mode-toggle");
      if (modeToggle) {
        modeToggle.addEventListener("click", () => {
          setMode(currentMode === "dark" ? "light" : "dark");
        });
      }

      const audio = document.getElementById("bg-audio");
      const audioToggle = document.getElementById("audio-toggle");

      if (audio && audioToggle) {
        audio.volume = 0.4;

        audio.play().catch(() => {});

        function updateAudioButton() {
          if (audio.paused) {
            audioToggle.textContent = "🔈 موسیقی خاموش";
            audioToggle.classList.remove("active");
          } else {
            audioToggle.textContent = "🔊 موسیقی روشن";
            audioToggle.classList.add("active");
          }
        }

        updateAudioButton();

        audioToggle.addEventListener("click", () => {
          if (audio.paused) {
            audio.play().catch(() => {});
          } else {
            audio.pause();
          }
          updateAudioButton();
        });
      }

      const introVideo = document.getElementById("intro-video");
      if (introVideo) {
        introVideo.play().catch(() => {});
      }
      setTimeout(() => {
        hideIntro();
      }, 3000);

      const menuToggle = document.getElementById("menu-toggle");
      if (menuToggle) {
        menuToggle.addEventListener("click", openSideMenu);
      }

      incrementPageView();
    });
  </script>
</body>
</html>
