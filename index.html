<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لیگ محلی - فوت‌موب ساده</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- فونت فارسی Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #151a2c;
      --card: #1d2236;
      --accent: #18a34a;
      --accent-soft: rgba(24, 163, 74, 0.2);
      --text: #f9fafb;
      --text-soft: #a1a5b5;
      --danger: #ef4444;
      --border: #262c46;
      --radius-lg: 18px;
      --radius-full: 999px;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      font-family: "Vazirmatn", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #1d2545, #050816 55%);
      color: var(--text);
    }

    .app {
      max-width: 1100px;
      margin: 24px auto 40px;
      padding: 0 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 16px;
      background: conic-gradient(from 160deg, #18a34a, #06b6d4, #6366f1, #18a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
    }

    .brand-logo span {
      font-weight: 800;
      font-size: 18px;
    }

    .brand-text-title {
      font-size: 22px;
      font-weight: 700;
    }

    .brand-text-sub {
      font-size: 13px;
      color: var(--text-soft);
    }

    .header-right {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      font-size: 12px;
      color: var(--text-soft);
    }

    .live-pill {
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 11px;
    }

    .audio-toggle {
      margin-top: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
    }

    .audio-toggle.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(34, 197, 94, 0.8);
    }

    nav {
      display: flex;
      gap: 8px;
      padding: 4px;
      background: rgba(9, 12, 24, 0.85);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(56, 63, 99, 0.8);
      box-shadow: var(--shadow-soft);
      margin-bottom: 18px;
      backdrop-filter: blur(14px);
    }

    nav button {
      flex: 1;
      border-radius: 999px;
      border: none;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      transition: 0.18s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    nav button .nav-icon {
      font-size: 16px;
    }

    nav button .nav-label {
      white-space: nowrap;
    }

    nav button.active {
      background: linear-gradient(135deg, #18a34a, #22c55e);
      color: #ecfdf3;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.55);
    }

    nav button.active .nav-icon {
      filter: drop-shadow(0 0 6px rgba(22, 163, 74, 0.8));
    }

    nav button:hover:not(.active) {
      background: rgba(37, 44, 79, 0.75);
      color: var(--text);
    }

    main {
      margin-top: 14px;
    }

    .section-title {
      font-size: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span.dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
    }

    .card {
      background: radial-gradient(circle at top left, #242b46, #111425 55%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .match-row {
      display: grid;
      grid-template-columns: 1.2fr auto 1.2fr;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .team-side {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-home {
      justify-content: flex-start;
    }

    .team-away {
      justify-content: flex-end;
    }

    .match-meta {
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }

    .team-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-name {
      font-weight: 500;
    }

    .team-logo {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #f9fafb;
      border: 1px solid rgba(15, 23, 42, 0.6);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.5);
    }

    .match-center {
      text-align: center;
    }

    .match-score {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .match-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-top: 2px;
    }

    .status-finished {
      background: rgba(37, 99, 235, 0.12);
      color: #60a5fa;
    }

    .status-live {
      background: rgba(248, 113, 113, 0.1);
      color: #f87171;
    }

    .status-upcoming {
      background: rgba(148, 163, 184, 0.12);
      color: #e5e7eb;
    }

    /* پیش‌بینی‌ها */
    .prediction-summary {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-soft);
    }

    .prediction-bars {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .prediction-bar {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      height: 16px;
    }

    .prediction-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      border-radius: 999px;
    }

    .prediction-fill-home {
      background: rgba(34, 197, 94, 0.5);
    }

    .prediction-fill-draw {
      background: rgba(148, 163, 184, 0.6);
    }

    .prediction-fill-away {
      background: rgba(59, 130, 246, 0.5);
    }

    .prediction-label {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 10px;
      line-height: 16px;
    }

    /* اکشن‌ها و کامنت‌ها */
    .match-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .action-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-soft);
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(30, 64, 175, 0.7);
      color: #e5e7eb;
    }

    .comments-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.4);
    }

    .comments-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 6px;
    }

    .comment-item {
      margin-bottom: 6px;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.85);
    }

    .comment-header {
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: 2px;
    }

    .comment-body {
      font-size: 12px;
    }

    .comment-empty {
      font-size: 11px;
      color: var(--text-soft);
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .comment-username {
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
    }

    .comment-username input {
      flex: 1;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 11px;
    }

    .comment-form textarea {
      resize: vertical;
      min-height: 40px;
      padding: 4px 6px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 12px;
    }

    .comment-form button {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ecfdf3;
      font-size: 11px;
      cursor: pointer;
    }

    .table-wrapper {
      background: radial-gradient(circle at top left, #202744, #101322 58%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 8px 0 4px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      background: rgba(15, 23, 42, 0.95);
    }

    th, td {
      padding: 7px 10px;
      text-align: center;
      border-bottom: 1px solid rgba(31, 41, 55, 0.9);
    }

    th:first-child, td:first-child {
      text-align: right;
    }

    th {
      font-weight: 600;
      color: var(--text-soft);
    }

    tbody tr:nth-child(even) {
      background: rgba(15, 23, 42, 0.7);
    }

    tbody tr:nth-child(odd) {
      background: rgba(15, 23, 42, 0.4);
    }

    .pos-pill {
      min-width: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 0;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .pos-top {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
    }

    .pos-mid {
      background: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
    }

    .pos-bottom {
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-name-sm {
      font-size: 12px;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .team-card {
      background: radial-gradient(circle at top, #252b42, #121626 58%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .team-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      color: var(--text-soft);
    }

    .tip-box {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-soft);
      border-radius: 14px;
      border: 1px dashed rgba(148, 163, 184, 0.6);
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.7);
    }

    .tip-box code {
      background: rgba(15, 23, 42, 0.9);
      padding: 2px 4px;
      border-radius: 6px;
      direction: ltr;
      display: inline-block;
      font-size: 10px;
    }

    @media (max-width: 680px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-right {
        align-items: flex-start;
      }
      .match-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .team-away {
        justify-content: flex-start;
      }
      .match-center {
        justify-self: flex-start;
        text-align: right;
      }
      .match-meta {
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- آهنگ پس‌زمینه: فایل music.mp3 را کنار index.html قرار بده -->
    <audio id="bg-audio" src="music.mp3" loop></audio>

    <header>
      <div class="brand">
        <div class="brand-logo">
          <span>LM</span>
        </div>
        <div>
          <div class="brand-text-title">کالیگا</div>
          <div class="brand-text-sub">لیگ فوتسال روستای چاشم</div>
        </div>
      </div>
      <div class="header-right">
        <div>فصل ۱۴۰۴ / ۲۰۲۵</div>
        <div>به‌روزرسانی نمونه دیتا برای تست</div>
        <div class="live-pill">نمایش دمو • استاتیک</div>
        <button id="audio-toggle" class="audio-toggle">🔈 موسیقی خاموش</button>
      </div>
    </header>

    <nav>
      <button class="tab-btn active" data-page="fixtures">
        <span class="nav-icon">📅</span>
        <span class="nav-label">برنامه بازی‌ها</span>
      </button>
      <button class="tab-btn" data-page="results">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">نتایج</span>
      </button>
      <button class="tab-btn" data-page="table">
        <span class="nav-icon">📊</span>
        <span class="nav-label">جدول لیگ</span>
      </button>
      <button class="tab-btn" data-page="teams">
        <span class="nav-icon">👥</span>
        <span class="nav-label">تیم‌ها</span>
      </button>
    </nav>

    <main id="page-content">
      <!-- محتوا با جاوااسکریپت تزریق می‌شود -->
    </main>

    <div class="tip-box">
      <strong>راهنمای سریع:</strong> بازی‌های آینده و گذشته در آرایه <code>matches</code> تعریف می‌شوند.  
      برای هر هفته‌ی جدید، یک آبجکت با <code>week</code>، تیم‌ها، تاریخ، ساعت و <code>status</code> بسازید.
    </div>
  </div>

  <script>
    // -----------------------------
    // ۱) تعریف تیم‌ها + لوگو (ایموجی)
    // -----------------------------
    const teams = [
      { id: 1,  name: "کافه لوین",                     shortName: "LVN",  color: "#0ea5e9", logo: "☕" },
      { id: 2,  name: "استودیو نامبر وان",            shortName: "NUO",  color: "#22c55e", logo: "🎬" },
      { id: 3,  name: "زنده یاد سید مهدی نبوی",       shortName: "SMN",  color: "#f97316", logo: "✨" },
      { id: 4,  name: "زنده یاد مجید جعفری",          shortName: "MJA",  color: "#a855f7", logo: "🌟" },
      { id: 5,  name: "زنده یاد بهمن و مصطفی جعفری",  shortName: "BMJ",  color: "#eab308", logo: "💎" },
      { id: 6,  name: "پیشکسوتان نیزوا",              shortName: "NZV",  color: "#ec4899", logo: "🛡️" },
      { id: 7,  name: "زنده یاد محمدرضا جعفری",       shortName: "MRJ",  color: "#6366f1", logo: "💫" },
      { id: 8,  name: "شهید نجفعلی قادری",            shortName: "NGH",  color: "#14b8a6", logo: "🕊️" },
      { id: 9,  name: "زنده یاد هادی قادری",          shortName: "HGH",  color: "#facc15", logo: "🌙" },
      { id: 10, name: "امامزاده پیش",                 shortName: "EZP",  color: "#4ade80", logo: "🕌" },
      { id: 11, name: "شهید سید احسان موسوی",         shortName: "SEM",  color: "#fb7185", logo: "🎖️" },
      { id: 12, name: "هیئت جوانان",                  shortName: "JVN",  color: "#2dd4bf", logo: "🔥" }
    ];

    // -----------------------------
    // ۲) تعریف بازی‌ها (هفته ۱، ۲، ۳)
    // -----------------------------
    // status: "upcoming" | "live" | "finished"
    const matches = [
      // هفته ۱ - بازی‌های انجام‌شده
      {
        id: 1,
        week: 1,
        homeTeamId: 3,
        awayTeamId: 10,
        date: "1404-08-30",
        time: "15:00",
        stadium: "سالن شهید صحافی",
        status: "finished",
        homeScore: 3,
        awayScore: 0
      },
      {
        id: 2,
        week: 1,
        homeTeamId: 2,
        awayTeamId: 11,
        date: "1404-08-30",
        time: "15:45",
        stadium: "سالن شهید صحافی",
        status: "finished",
        homeScore: 3,
        awayScore: 0
      },
      {
        id: 3,
        week: 1,
        homeTeamId: 9,
        awayTeamId: 4,
        date: "1404-08-30",
        time: "16:50",
        stadium: "سالن شهید صحافی",
        status: "finished",
        homeScore: 2,
        awayScore: 4
      },
      {
        id: 4,
        week: 1,
        homeTeamId: 7,
        awayTeamId: 5,
        date: "1404-08-30",
        time: "17:45",
        stadium: "سالن شهید صحافی",
        status: "finished",
        homeScore: 1,
        awayScore: 2
      },
      {
        id: 5,
        week: 1,
        homeTeamId: 12,
        awayTeamId: 1,
        date: "1404-08-30",
        time: "18:30",
        stadium: "سالن شهید صحافی",
        status: "finished",
        homeScore: 1,
        awayScore: 5
      },
      {
        id: 6,
        week: 1,
        homeTeamId: 6,
        awayTeamId: 8,
        date: "1404-08-30",
        time: "19:15",
        stadium: "سالن شهید صحافی",
        status: "finished",
        homeScore: 1,
        awayScore: 0
      },

      // هفته ۲ - نمونه بازی آینده
      {
        id: 7,
        week: 2,
        homeTeamId: 1,   // کافه لوین
        awayTeamId: 4,   // زنده یاد مجید جعفری
        date: "1404-09-01",
        time: "18:00",
        stadium: "سالن شهید صحافی",
        status: "upcoming"
      },

      // هفته ۳ - نمونه بازی آینده
      {
        id: 8,
        week: 3,
        homeTeamId: 8,   // شهید نجفعلی قادری
        awayTeamId: 2,   // استودیو نامبر وان
        date: "1404-09-05",
        time: "19:00",
        stadium: "سالن شهید صحافی",
        status: "upcoming"
      }
    ];

    // -----------------------------
    // ۳) توابع کمکی ساده
    // -----------------------------
    function getTeamById(id) {
      return teams.find(t => t.id === id);
    }

    function formatDate(dateStr) {
      const [y, m, d] = dateStr.split("-");
      return `${d} / ${m}`;
    }

    function getStatusLabel(status) {
      switch (status) {
        case "finished": return "پایان یافته";
        case "live":     return "زنده";
        case "upcoming":
        default:         return "بازی آتی";
      }
    }

    function getStatusClass(status) {
      switch (status) {
        case "finished": return "status-finished";
        case "live":     return "status-live";
        case "upcoming":
        default:         return "status-upcoming";
      }
    }

    // -----------------------------
    // ۴) استوریج برای پیش‌بینی و کامنت
    // -----------------------------
    const STORAGE_KEYS = {
      predictions: "kaliga_predictions",
      comments: "kaliga_comments",
      username: "kaliga_username"
    };

    function loadFromStorage(key) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveToStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    }

    function getSavedUsername() {
      return localStorage.getItem(STORAGE_KEYS.username) || "";
    }

    function setSavedUsername(name) {
      try {
        localStorage.setItem(STORAGE_KEYS.username, name);
      } catch (e) {}
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/[&<>"']/g, ch => {
        const map = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" };
        return map[ch] || ch;
      });
    }

    // ---- پیش‌بینی‌ها
    function loadPredictions() {
      return loadFromStorage(STORAGE_KEYS.predictions);
    }

    function savePredictions(preds) {
      saveToStorage(STORAGE_KEYS.predictions, preds);
    }

    function savePrediction(matchId, homeScore, awayScore) {
      let preds = loadPredictions();
      const username = getSavedUsername() || null;
      const newPred = { matchId, homeScore, awayScore, username, t: Date.now() };

      if (username) {
        preds = preds.filter(p => !(p.matchId === matchId && p.username === username));
      }
      preds.push(newPred);
      savePredictions(preds);
    }

    function getPredictionStats(matchId) {
      const preds = loadPredictions().filter(p => p.matchId === matchId);
      if (preds.length === 0) return null;
      let home = 0, draw = 0, away = 0;
      preds.forEach(p => {
        if (p.homeScore > p.awayScore) home++;
        else if (p.homeScore < p.awayScore) away++;
        else draw++;
      });
      const total = home + draw + away;
      if (!total) return null;
      const homePercent = Math.round(home * 100 / total);
      const drawPercent = Math.round(draw * 100 / total);
      const awayPercent = Math.round(away * 100 / total);
      return { homePercent, drawPercent, awayPercent, total };
    }

    // ---- کامنت‌ها
    function loadComments() {
      return loadFromStorage(STORAGE_KEYS.comments);
    }

    function saveComments(list) {
      saveToStorage(STORAGE_KEYS.comments, list);
    }

    function renderCommentsHtml(matchId) {
      const all = loadComments().filter(c => c.matchId === matchId);
      const username = getSavedUsername();
      let html = `<div class="comments-list">`;
      if (all.length === 0) {
        html += `<div class="comment-empty">هنوز نظری برای این بازی ثبت نشده است.</div>`;
      } else {
        all.forEach(c => {
          const name = c.username || "کاربر مهمان";
          html += `
            <div class="comment-item">
              <div class="comment-header">${escapeHtml(name)}</div>
              <div class="comment-body">${escapeHtml(c.text)}</div>
            </div>
          `;
        });
      }
      html += `</div>`;
      html += `
        <div class="comment-form">
          <div class="comment-username">
            <label>نام کاربری:</label>
            <input type="text" id="username-input-${matchId}" value="${escapeHtml(username)}" placeholder="مثلاً kaliga_fan" />
            <button type="button" onclick="saveUsernameFromInput(${matchId})">ثبت</button>
          </div>
          <textarea id="comment-input-${matchId}" rows="2" placeholder="نظر خود را درباره این بازی بنویسید..."></textarea>
          <button type="button" onclick="submitComment(${matchId})">ارسال نظر</button>
        </div>
      `;
      return html;
    }

    function toggleComments(matchId) {
      const el = document.getElementById(`comments-${matchId}`);
      if (!el) return;
      if (el.style.display === "none" || !el.style.display) {
        el.style.display = "block";
        el.innerHTML = renderCommentsHtml(matchId);
      } else {
        el.style.display = "none";
      }
    }

    function saveUsernameFromInput(matchId) {
      const inp = document.getElementById(`username-input-${matchId}`);
      if (!inp) return;
      const name = inp.value.trim();
      if (!name) {
        alert("نام کاربری نمی‌تواند خالی باشد.");
        return;
      }
      setSavedUsername(name);
      alert("نام کاربری ذخیره شد.");
      const el = document.getElementById(`comments-${matchId}`);
      if (el) el.innerHTML = renderCommentsHtml(matchId);
    }

    function submitComment(matchId) {
      const username = getSavedUsername().trim();
      if (!username) {
        alert("قبل از ارسال نظر، ابتدا نام کاربری را ثبت کن.");
        return;
      }
      const textarea = document.getElementById(`comment-input-${matchId}`);
      if (!textarea) return;
      const text = textarea.value.trim();
      if (!text) {
        alert("متن نظر نمی‌تواند خالی باشد.");
        return;
      }
      const all = loadComments();
      all.push({ matchId, username, text, t: Date.now() });
      saveComments(all);
      textarea.value = "";
      const el = document.getElementById(`comments-${matchId}`);
      if (el) el.innerHTML = renderCommentsHtml(matchId);
    }

    // -----------------------------
    // ۵) رندر برنامه بازی‌ها (آتی + زنده)
    // -----------------------------
    function renderFixturesPage() {
      const container = document.getElementById("page-content");
      const upcoming = matches.filter(m => m.status === "upcoming" || m.status === "live");
      const finished = matches.filter(m => m.status === "finished");

      let html = "";

      html += `
        <div class="section-title">
          <span class="dot"></span>
          <span>برنامه بازی‌های آتی و درحال برگزاری</span>
        </div>
      `;

      if (upcoming.length === 0) {
        html += `<div class="card">در حال حاضر بازی آتی ثبت نشده است.</div>`;
      } else {
        upcoming.forEach(match => {
          const home = getTeamById(match.homeTeamId);
          const away = getTeamById(match.awayTeamId);
          const stats = getPredictionStats(match.id);

          html += `
            <div class="card">
              <div class="match-row">
                <div class="team-side team-home">
                  <div class="team-logo" style="background:${home.color}">${home.logo}</div>
                  <div class="team-name">${home.name}</div>
                </div>
                <div class="match-center">
          `;

          if (match.status === "upcoming") {
            html += `
                  <div class="match-score">- : -</div>
                  <div class="match-status ${getStatusClass(match.status)}">
                    ${getStatusLabel(match.status)}
                  </div>
            `;
          } else {
            html += `
                  <div class="match-score">${match.homeScore} : ${match.awayScore}</div>
                  <div class="match-status ${getStatusClass(match.status)}">
                    ${getStatusLabel(match.status)}
                  </div>
            `;
          }

          html += `
                </div>
                <div class="team-side team-away">
                  <div class="team-name">${away.name}</div>
                  <div class="team-logo" style="background:${away.color}">${away.logo}</div>
                </div>
              </div>
              <div class="match-meta">
                <span>هفته ${match.week} • ${match.stadium}</span>
                <span>تاریخ: ${formatDate(match.date)} • ${match.time}</span>
              </div>
          `;

          if (stats) {
            html += `
              <div class="prediction-summary">
                <div>پیش‌بینی کاربران (تعداد ${stats.total}):</div>
                <div class="prediction-bars">
                  <div class="prediction-bar">
                    <div class="prediction-fill prediction-fill-home" style="width:${stats.homePercent}%"></div>
                    <div class="prediction-label">برد میزبان ${stats.homePercent}%</div>
                  </div>
                  <div class="prediction-bar">
                    <div class="prediction-fill prediction-fill-draw" style="width:${stats.drawPercent}%"></div>
                    <div class="prediction-label">مساوی ${stats.drawPercent}%</div>
                  </div>
                  <div class="prediction-bar">
                    <div class="prediction-fill prediction-fill-away" style="width:${stats.awayPercent}%"></div>
                    <div class="prediction-label">برد مهمان ${stats.awayPercent}%</div>
                  </div>
                </div>
              </div>
            `;
          }

          html += `
              <div class="match-actions">
                <button class="action-btn" onclick="handlePrediction(${match.id})">📊 ثبت پیش‌بینی</button>
              </div>
            </div>
          `;
        });
      }

      // آخرین نتایج (خلاصه)
      html += `
        <div class="section-title" style="margin-top:14px;">
          <span class="dot"></span>
          <span>آخرین نتایج</span>
        </div>
      `;

      if (finished.length === 0) {
        html += `<div class="card">فعلاً بازی پایان یافته‌ای ثبت نشده است.</div>`;
      } else {
        finished.slice(-3).reverse().forEach(match => {
          const home = getTeamById(match.homeTeamId);
          const away = getTeamById(match.awayTeamId);

          html += `
            <div class="card">
              <div class="match-row">
                <div class="team-side team-home">
                  <div class="team-logo" style="background:${home.color}">${home.logo}</div>
                  <div class="team-name">${home.name}</div>
                </div>
                <div class="match-center">
                  <div class="match-score">${match.homeScore} : ${match.awayScore}</div>
                  <div class="match-status status-finished">پایان یافته</div>
                </div>
                <div class="team-side team-away">
                  <div class="team-name">${away.name}</div>
                  <div class="team-logo" style="background:${away.color}">${away.logo}</div>
                </div>
              </div>
              <div class="match-meta">
                <span>هفته ${match.week}</span>
                <span>${formatDate(match.date)}</span>
              </div>
            </div>
          `;
        });
      }

      container.innerHTML = html;
    }

    // -----------------------------
    // ۶) رندر صفحه نتایج (با کامنت)
    // -----------------------------
    function renderResultsPage() {
      const container = document.getElementById("page-content");
      const finished = matches.filter(m => m.status === "finished");

      let html = `
        <div class="section-title">
          <span class="dot"></span>
          <span>نتایج کامل • همه‌ی هفته‌ها</span>
        </div>
      `;

      if (finished.length === 0) {
        html += `<div class="card">فعلاً نتیجه نهایی ثبت نشده است.</div>`;
      } else {
        finished.forEach(match => {
          const home = getTeamById(match.homeTeamId);
          const away = getTeamById(match.awayTeamId);

          html += `
            <div class="card">
              <div class="match-row">
                <div class="team-side team-home">
                  <div class="team-logo" style="background:${home.color}">${home.logo}</div>
                  <div class="team-name">${home.name}</div>
                </div>
                <div class="match-center">
                  <div class="match-score">${match.homeScore} : ${match.awayScore}</div>
                  <div class="match-status status-finished">پایان یافته</div>
                </div>
                <div class="team-side team-away">
                  <div class="team-name">${away.name}</div>
                  <div class="team-logo" style="background:${away.color}">${away.logo}</div>
                </div>
              </div>
              <div class="match-meta">
                <span>هفته ${match.week} • ${match.stadium}</span>
                <span>تاریخ: ${formatDate(match.date)} • ${match.time}</span>
              </div>
              <div class="match-actions">
                <button class="action-btn" onclick="toggleComments(${match.id})">💬 نظرات بازی</button>
              </div>
              <div class="comments-section" id="comments-${match.id}" style="display:none;"></div>
            </div>
          `;
        });
      }

      container.innerHTML = html;
    }

    // -----------------------------
    // ۷) جدول لیگ
    // -----------------------------
    function calculateTable() {
      const stats = new Map();
      teams.forEach(team => {
        stats.set(team.id, {
          teamId: team.id,
          played: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          goalsFor: 0,
          goalsAgainst: 0,
          points: 0
        });
      });

      matches.filter(m => m.status === "finished").forEach(match => {
        const homeStat = stats.get(match.homeTeamId);
        const awayStat = stats.get(match.awayTeamId);

        homeStat.played += 1;
        awayStat.played += 1;

        homeStat.goalsFor += match.homeScore;
        homeStat.goalsAgainst += match.awayScore;

        awayStat.goalsFor += match.awayScore;
        awayStat.goalsAgainst += match.homeScore;

        if (match.homeScore > match.awayScore) {
          homeStat.wins += 1;
          awayStat.losses += 1;
          homeStat.points += 3;
        } else if (match.homeScore < match.awayScore) {
          awayStat.wins += 1;
          homeStat.losses += 1;
          awayStat.points += 3;
        } else {
          homeStat.draws += 1;
          awayStat.draws += 1;
          homeStat.points += 1;
          awayStat.points += 1;
        }
      });

      const tableArray = Array.from(stats.values());
      tableArray.sort((a, b) => {
        const gdA = a.goalsFor - a.goalsAgainst;
        const gdB = b.goalsFor - b.goalsAgainst;
        if (b.points !== a.points) return b.points - a.points;
        if (gdB !== gdA) return gdB - gdA;
        if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
        const teamA = getTeamById(a.teamId).name;
        const teamB = getTeamById(b.teamId).name;
        return teamA.localeCompare(teamB, "fa");
      });

      return tableArray;
    }

    function getPosClass(pos) {
      if (pos <= 4) return "pos-top";
      if (pos >= 10) return "pos-bottom";
      return "pos-mid";
    }

    function renderTablePage() {
      const container = document.getElementById("page-content");
      const tableData = calculateTable();

      let html = `
        <div class="section-title">
          <span class="dot"></span>
          <span>جدول لیگ</span>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>تیم</th>
                <th>بازی</th>
                <th>برد</th>
                <th>مساوی</th>
                <th>باخت</th>
                <th>گل زده</th>
                <th>گل خورده</th>
                <th>تفاضل</th>
                <th>امتیاز</th>
              </tr>
            </thead>
            <tbody>
      `;

      tableData.forEach((row, index) => {
        const team = getTeamById(row.teamId);
        const pos = index + 1;
        const gd = row.goalsFor - row.goalsAgainst;

        html += `
          <tr>
            <td><span class="pos-pill ${getPosClass(pos)}">${pos}</span></td>
            <td>
              <div class="team-cell">
                <div class="team-logo" style="width:22px;height:22px;font-size:15px;background:${team.color}">${team.logo}</div>
                <span class="team-name-sm">${team.name}</span>
              </div>
            </td>
            <td>${row.played}</td>
            <td>${row.wins}</td>
            <td>${row.draws}</td>
            <td>${row.losses}</td>
            <td>${row.goalsFor}</td>
            <td>${row.goalsAgainst}</td>
            <td>${gd}</td>
            <td>${row.points}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;
    }

    // -----------------------------
    // ۸) صفحه تیم‌ها
    // -----------------------------
    function renderTeamsPage() {
      const container = document.getElementById("page-content");

      let html = `
        <div class="section-title">
          <span class="dot"></span>
          <span>معرفی تیم‌ها</span>
        </div>
        <div class="teams-grid">
      `;

      teams.forEach(team => {
        html += `
          <div class="team-card">
            <div class="team-header">
              <div class="team-line">
                <div class="team-logo" style="background:${team.color}">${team.logo}</div>
                <div class="team-name">${team.name}</div>
              </div>
              <span class="badge">کد تیم: ${team.shortName}</span>
            </div>
            <div style="font-size:11px;color:var(--text-soft);">
              این متن دمو است. می‌تونی این توضیحات را با تاریخچه، شهر، یا هر اطلاعات دلخواه درباره این تیم عوض کنی.
            </div>
          </div>
        `;
      });

      html += `</div>`;

      container.innerHTML = html;
    }

    // -----------------------------
    // ۹) اکشن پیش‌بینی
    // -----------------------------
    function handlePrediction(matchId) {
      const match = matches.find(m => m.id === matchId);
      if (!match) return;
      const home = getTeamById(match.homeTeamId);
      const away = getTeamById(match.awayTeamId);

      let hs = prompt(`گل‌های ${home.name} را برای پیش‌بینی وارد کن:`, "0");
      if (hs === null) return;
      let as = prompt(`گل‌های ${away.name} را برای پیش‌بینی وارد کن:`, "0");
      if (as === null) return;

      hs = parseInt(hs, 10);
      as = parseInt(as, 10);
      if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0) {
        alert("لطفاً فقط عدد صحیح مثبت وارد کن.");
        return;
      }

      savePrediction(matchId, hs, as);
      alert("پیش‌بینی شما ذخیره شد.");

      const activeBtn = document.querySelector(".tab-btn.active");
      if (activeBtn) setActivePage(activeBtn.dataset.page);
    }

    // -----------------------------
    // ۱۰) مدیریت تب‌ها + موسیقی
    // -----------------------------
    function setActivePage(page) {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
      });

      if (page === "fixtures") renderFixturesPage();
      else if (page === "results") renderResultsPage();
      else if (page === "table") renderTablePage();
      else if (page === "teams") renderTeamsPage();
    }

    document.addEventListener("DOMContentLoaded", () => {
      // تب‌ها
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          setActivePage(btn.dataset.page);
        });
      });
      setActivePage("fixtures");

      // موسیقی
      const audio = document.getElementById("bg-audio");
      const audioToggle = document.getElementById("audio-toggle");

      if (audio && audioToggle) {
        audio.volume = 0.4;

        // تلاش برای پخش خودکار (ممکن است بلاک شود)
        audio.play().catch(() => {});

        function updateAudioButton() {
          if (audio.paused) {
            audioToggle.textContent = "🔈 موسیقی خاموش";
            audioToggle.classList.remove("active");
          } else {
            audioToggle.textContent = "🔊 موسیقی روشن";
            audioToggle.classList.add("active");
          }
        }

        updateAudioButton();

        audioToggle.addEventListener("click", () => {
          if (audio.paused) {
            audio.play().catch(() => {});
          } else {
            audio.pause();
          }
          updateAudioButton();
        });
      }
    });
  </script>
</body>
