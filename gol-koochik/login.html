<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود تیم | گل کوچک کالیگا</title>
<link rel="stylesheet" href="styles.css?v=7"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="shell"><header class="topbar"><a class="brand" href="./"><img src="../logo.png" alt="لوگوی کالیگا"><span><strong>ورود تیم‌ها</strong><span>مسابقات گل کوچک</span></span></a><a class="link-button" href="./">بازگشت</a></header>
<section class="auth-box"><div class="panel"><h1>ورود به صفحه اختصاصی تیم</h1><p class="lead">نام تیم همان نام کاربری است و رمز، همان رمزی است که کاپیتان هنگام ثبت‌نام تعیین کرده است.</p>
<form id="login-form" class="form-shell"><div class="field"><label for="team-name">نام تیم</label><input id="team-name" required autocomplete="username" maxlength="60"></div><div class="field"><label for="password">رمز ورود</label><input id="password" type="password" required autocomplete="current-password" minlength="8"></div><div class="submit-row"><button class="button primary" type="submit">ورود به صفحه تیم</button><div class="message" id="message"></div></div></form>
<div class="auth-links"><a href="register.html">هنوز ثبت‌نام نکرده‌اید؟</a><a href="./">صفحه مسابقات</a></div></div></section><footer>Desinged by Sajjad Nabavi</footer></main>
<script src="config.js?v=7"></script><script src="common.js?v=7"></script><script>
(async()=>{const K=KaligaGol;const existing=await K.currentSession();if(existing?.user?.user_metadata?.account_type==='gol_team'){location.replace('team/');return;}if(existing)await K.client.auth.signOut();const form=document.getElementById('login-form'),msg=document.getElementById('message');form.addEventListener('submit',async e=>{e.preventDefault();K.setMessage(msg,'در حال ورود...','info');const button=form.querySelector('button');button.disabled=true;try{const name=document.getElementById('team-name').value;const password=document.getElementById('password').value;const email=await K.accountEmail('team',name);const {error}=await K.client.auth.signInWithPassword({email,password});if(error)throw error;location.replace('team/');}catch(err){console.error(err);K.setMessage(msg,'نام تیم یا رمز ورود صحیح نیست.','error');button.disabled=false;}})})();
</script></body></html>
