<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>کالیگا | فصل ۱۴۰۵</title>
  <meta name="description" content="فصل ۱۴۰۵ لیگ فوتسال کالیگا به‌زودی آغاز می‌شود">
  <meta name="theme-color" content="#06101f">
  <style>
    :root{color-scheme:dark;--text:#f8fafc;--muted:#aab8cb;--gold:#f5bf42;--line:rgba(255,255,255,.16)}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:#020817;display:grid;place-items:center;padding:22px;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(2,8,23,.98),rgba(2,8,23,.82) 48%,rgba(2,8,23,.18)),url("../assets/futsal-hero.jpg") center/cover no-repeat;z-index:-2}
    body::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 75% 20%,rgba(245,191,66,.15),transparent 32%),linear-gradient(0deg,rgba(2,8,23,.88),transparent 45%);z-index:-1}
    main{width:min(980px,100%);min-height:610px;display:flex;align-items:center}
    .content{width:min(610px,100%);padding:42px;border-radius:30px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(9,20,37,.88),rgba(3,10,21,.74));backdrop-filter:blur(10px);box-shadow:0 28px 80px rgba(0,0,0,.55)}
    .brand{display:flex;align-items:center;gap:13px}.brand img{width:72px;height:72px;object-fit:contain}.brand strong{font-size:25px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:5px}
    .tag{display:inline-flex;margin-top:28px;padding:6px 12px;border-radius:999px;border:1px solid rgba(245,191,66,.35);background:rgba(245,191,66,.10);color:#ffda78;font-size:12px}
    h1{font-size:clamp(36px,6vw,62px);line-height:1.35;margin:18px 0 10px}.soon{color:#ffd363}.lead{color:var(--muted);line-height:2;font-size:14px;margin:0 0 25px}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{padding:13px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);font-size:11px;color:#dce5f1;text-align:center}.step b{display:block;font-size:20px;margin-bottom:6px}
    .back{display:inline-flex;margin-top:26px;text-decoration:none;color:#e7edf6;border:1px solid var(--line);border-radius:999px;padding:10px 17px;background:rgba(255,255,255,.05)}.back:hover{border-color:var(--gold);color:#ffdc7e}
    @media(max-width:620px){body::before{background:linear-gradient(180deg,rgba(2,8,23,.20),rgba(2,8,23,.97) 52%),url("../assets/futsal-hero.jpg") 68% top/cover no-repeat}.content{padding:26px 19px;margin-top:150px;border-radius:23px}.steps{grid-template-columns:1fr}.brand img{width:58px;height:58px}}
  </style>
</head>
<body>
  <main><section class="content">
    <div class="brand"><img src="../logo.png" alt="لوگوی کالیگا"><div><strong>کالیگا</strong><span>لیگ فوتسال روستای چاشم</span></div></div>
    <span class="tag">⚽ فصل جدید مسابقات</span>
    <h1>فصل ۱۴۰۵<br><span class="soon">هنوز شروع نشده</span></h1>
    <p class="lead">اطلاعات تیم‌ها، بازیکنان، قرعه‌کشی و برنامه مسابقات فصل جدید پس از نهایی‌شدن در همین صفحه منتشر خواهد شد. به‌زودی با یک فصل تازه برمی‌گردیم.</p>
    <div class="steps"><div class="step"><b>👥</b>معرفی تیم‌ها</div><div class="step"><b>🎲</b>قرعه‌کشی</div><div class="step"><b>📅</b>برنامه مسابقات</div></div>
    <a class="back" href="../">بازگشت به صفحه اصلی ←</a>
  </section></main>
</body>
</html>
